<style>
:root{
  /* Direction: a JLPT mark sheet. Indigo drop-out print on warm paper, graphite pencil fills, numbered bubbles 1–4. */
  --paper:#f3f2ee;
  --sheet:#ffffff;
  --ink:#1e2126;
  --muted:#5d636b;
  --print:#3b55a0;
  --print-soft:#e5e9f5;
  --line:#cdd5e8;
  --lead:#26282c;
  --lead-ink:#ffffff;
  --good:#1d6e44;
  --good-soft:#e1f1e7;
  --bad:#b02a20;
  --bad-soft:#fbe6e3;
  --f-form:"Barlow Condensed","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-jp:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN","MS PMincho",serif;
  --f-kyo:"Klee One","Noto Serif JP","Yu Mincho",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121418;--sheet:#1a1d22;--ink:#e9e8e3;--muted:#a2a8b0;
    --print:#93aef0;--print-soft:#1f2740;--line:#323c55;
    --lead:#e9e8e3;--lead-ink:#121418;
    --good:#72d09b;--good-soft:#17342a;--bad:#ff9086;--bad-soft:#3d1d1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121418;--sheet:#1a1d22;--ink:#e9e8e3;--muted:#a2a8b0;
  --print:#93aef0;--print-soft:#1f2740;--line:#323c55;
  --lead:#e9e8e3;--lead-ink:#121418;
  --good:#72d09b;--good-soft:#17342a;--bad:#ff9086;--bad-soft:#3d1d1a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--f-ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--print);outline-offset:2px}
/* Japanese interface: Japanese gothic for the UI, Mincho for Japanese study text, Chinese content keeps Chinese fonts */
html[lang="ja"] body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif}
html[lang="ja"] [lang="zh-Hant"]{font-family:var(--f-ui)}
body [lang="ja"]{font-family:var(--f-jp)}
.prefs{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--sheet)}
.seg button{border:0;background:none;border-radius:999px;min-height:30px;padding:4px 12px;font:600 13px/1.2 var(--f-ui);color:var(--muted);cursor:pointer}
.seg button[lang="ja"]{font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",var(--f-ui)}
.seg button[aria-pressed="true"]{background:var(--lead);color:var(--lead-ink)}
.seg button[aria-pressed="false"]:hover{color:var(--ink)}
.lvl{position:relative}
.lvl-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px 4px 14px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);font:700 14px/1.2 var(--f-ui);color:var(--ink);cursor:pointer}
.lvl-btn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lvl-btn[aria-expanded="true"]{border-color:var(--print)}
.lvl-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.lvl-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:170px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);box-shadow:0 12px 32px rgba(0,0,0,.16)}
.lvl-menu[hidden]{display:none}
.lvl-menu button{display:flex;width:100%;align-items:baseline;gap:12px;min-height:42px;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--ink);text-align:left;cursor:pointer;font:500 14px/1.3 var(--f-ui)}
.lvl-menu button b{font-weight:700;min-width:24px}
.lvl-menu button span{color:var(--muted);font-size:13px}
.lvl-menu button:hover{background:var(--print-soft)}
.lvl-menu button[aria-checked="true"]{background:var(--lead);color:var(--lead-ink)}
.lvl-menu button[aria-checked="true"] span{color:inherit;opacity:.78}
.ptext .plabel{display:inline-block;margin:16px 0 4px;padding:0 10px;border:1.5px solid var(--print);border-radius:6px;color:var(--print);font:700 14px/1.6 var(--f-num);text-indent:0}
.ptext .plabel:first-child{margin-top:0}
.qsub{margin-left:8px;color:var(--muted);font-size:13px;font-family:var(--f-ui)}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
.foot{max-width:680px;margin:0 auto;padding:8px 16px 48px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}
.foot p{margin:0}
.home-main,.home-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.kbd{display:none;margin:0;font-size:13px;color:var(--muted)}
.kbd kbd{font:600 12px/1 var(--f-num);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 6px;margin:0 2px;background:var(--sheet);color:var(--ink)}
.qnav + .kbd{text-align:right;margin-top:-6px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sec-head{font-family:var(--f-form);font-weight:600;letter-spacing:.08em;font-size:15px;color:var(--print);padding:10px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-head small{font-family:var(--f-ui);font-weight:400;letter-spacing:0;color:var(--muted);font-size:13px}
.pad{padding:14px 16px}
.pad p{margin:0 0 10px}
.pad p:last-child{margin-bottom:0}
a{color:var(--print)}

/* Ruby: furigana can be switched on and off for questions; explanations always show it */
ruby{ruby-position:over}
rt{font-size:.5em;font-family:var(--f-jp);letter-spacing:0;color:var(--muted)}
html:not(.furi) .fz rt{display:none}
.tg{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px}
.blank{display:inline-block;min-width:4.5em;text-align:center;letter-spacing:.1em}
.fill{color:var(--good);font-weight:600;border-bottom:2px solid var(--good)}
.slot{display:inline-block;width:3.2em;border-bottom:2px solid var(--muted);margin:0 3px;vertical-align:baseline;text-align:center;line-height:1.2;color:var(--print);font-family:var(--f-num);font-size:.85em}
.slot.star{border-color:var(--print)}

/* Masthead */
.mast-band{display:flex;justify-content:space-between;gap:12px;background:var(--print);color:var(--sheet);font-family:var(--f-form);font-weight:600;letter-spacing:.1em;font-size:14px;padding:6px 16px}
.mast-body{padding:18px 16px 16px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.deco{display:flex;gap:6px;margin-bottom:12px}
.deco i{width:24px;height:24px;border:1.5px solid var(--print);border-radius:50%;display:grid;place-items:center;font:600 11px/1 var(--f-num);font-style:normal;color:var(--print)}
.deco i.on{animation:pencil .5s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes pencil{from{background:transparent;color:var(--print);border-color:var(--print);transform:scale(.8)}60%{transform:scale(1.12)}to{background:var(--lead);color:var(--lead-ink);border-color:var(--lead);transform:scale(1)}}
.mast h1{margin:0;font-size:clamp(28px,7.5vw,38px);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
.mast p{margin:6px 0 0;color:var(--muted);font-size:15px}
.count{text-align:right;line-height:1.1}
.count small{display:block;font-size:12px;color:var(--print);letter-spacing:.04em}
.count b{font:600 44px/1 var(--f-num);font-variant-numeric:tabular-nums}
.count span{font-family:var(--f-jp);font-size:16px;margin-left:4px}
.count.today b{font-size:26px;font-family:var(--f-ui)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stat{padding:10px 16px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat span{display:block;font-size:12px;color:var(--print);letter-spacing:.04em}
.stat b{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

/* Mode rows */
.mode{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;cursor:pointer}
.mode:last-child{border-bottom:0}
.mode:hover:not([disabled]){background:var(--print-soft)}
.mode.primary{background:var(--print-soft)}
.mode .tag{font-family:var(--f-jp);font-weight:600;font-size:15px;color:var(--print);line-height:1.2}
.mode .tag small{display:block;font-family:var(--f-ui);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.mode b{display:block;font-size:17px;line-height:1.35}
.mode .desc{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px}
.mode .go{font-family:var(--f-form);font-weight:600;color:var(--print);font-size:16px;white-space:nowrap}
.mode[disabled]{cursor:default}
.mode[disabled] .tag,.mode[disabled] b,.mode[disabled] .go{opacity:.45}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.opt-row:last-child{border-bottom:0}
.opt-row p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.opt-row strong{display:block;color:var(--ink);font-size:16px}
.switch{position:relative;display:inline-flex;cursor:pointer;flex:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .track{background:var(--print)}
.switch input:checked + .track::after{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:2px solid var(--print);outline-offset:2px}

/* Checklist + tips */
.check{list-style:none;margin:0;padding:6px 0}
.check label{display:flex;align-items:flex-start;gap:12px;padding:8px 16px;cursor:pointer;line-height:1.5}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--print);border-radius:50%;margin:0;flex:none;background:var(--sheet);cursor:pointer;transition:background .15s}
.check input:checked{background:var(--lead);border-color:var(--lead)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.check small{display:block;color:var(--muted);font-size:13px}
.tips{margin:0;padding:12px 16px 14px 40px;display:flex;flex-direction:column;gap:8px}
.tips li{padding-left:4px}
.tips li::marker{font-family:var(--f-num);color:var(--print);font-weight:600}

/* Section picker */
.trow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow > div > b{display:block;font-family:var(--f-jp);font-weight:600;font-size:17px}
.trow > div > b small{font-family:var(--f-num);font-weight:500;color:var(--print);font-size:12px;margin-right:6px}
.trow > div > span{display:block;color:var(--muted);font-size:14px}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px;max-width:220px}
.meter i{display:block;height:100%;background:var(--print)}

/* Quiz */
.qtop{display:flex;align-items:center;gap:12px}
.btn-ghost{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{border-color:var(--print)}
.btn-ghost[aria-pressed="true"]{background:var(--print-soft);border-color:var(--print);color:var(--print)}
.qtitle{font-family:var(--f-form);font-weight:600;letter-spacing:.06em;color:var(--print);flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcount{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.qcount .tl{color:var(--print);margin-right:8px}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.strip i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11px/1 var(--f-num);font-style:normal;color:var(--muted);background:var(--sheet)}
.strip i.cur{border-color:var(--print);color:var(--print);box-shadow:0 0 0 3px var(--print-soft)}
.strip i.ok{background:var(--good);border-color:var(--good);color:var(--sheet)}
.strip i.ng{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.strip i.done{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.qcard{padding:16px}
.passage{border:1px solid var(--line);border-radius:4px;margin-bottom:18px;background:var(--paper)}
.passage summary{font-family:var(--f-form);font-weight:600;letter-spacing:.05em;color:var(--print);padding:8px 12px;cursor:pointer;font-size:15px}
.ptext{padding:2px 14px 14px;font-size:17px;line-height:2}
.ptext p{margin:0 0 8px;text-indent:1em}
.ptext p.ni{text-indent:0}
.ptext p:last-child{margin-bottom:0}
.ptext h4{margin:4px 0 8px;text-align:center;font-size:18px}
.ptext table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.6;margin:6px 0 10px}
.ptext th,.ptext td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.ptext th{background:var(--print-soft);font-weight:600}
.pb{display:inline-block;min-width:2.6em;padding:0 6px;border:1.5px solid var(--muted);border-radius:3px;font:600 13px/1.5 var(--f-num);color:var(--muted);text-align:center;text-indent:0}
.pb.cur{background:var(--print-soft);border-color:var(--print);color:var(--print)}
.qnum{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.qnum .ptag{color:var(--print);font-family:var(--f-jp);font-weight:600;font-size:14px}
.qtools{margin-left:auto;display:flex;gap:6px}
.qtools .btn-ghost{padding:3px 10px;font-size:13px}
.prompt{font-size:20px;line-height:2;margin:0 0 14px;text-wrap:pretty}
.prompt.small{font-size:17px;line-height:1.9}
.word{font-family:var(--f-kyo);font-size:30px;font-weight:600;margin:0 0 10px;line-height:1.5}
.audio{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--print);color:var(--sheet);border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
.play svg{width:16px;height:16px;fill:currentColor}
.play.on{opacity:.75}
.note{font-size:14px;color:var(--muted);margin:0 0 12px}
.situ{background:var(--paper);border-left:3px solid var(--print);padding:8px 12px;margin:0 0 14px;font-size:16px}
.situ .ja{display:block;font-size:17px;margin-top:2px}
.transcript{background:var(--paper);border-radius:4px;padding:10px 12px;margin:0 0 12px;font-size:16px;line-height:1.9}
.transcript p{margin:0}
.transcript .sp{font:600 12px/1 var(--f-ui);color:var(--print);margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;font-size:18px;line-height:1.7;min-height:54px}
.opt.long{font-size:16px}
button.opt:hover{border-color:var(--print)}
div.opt{cursor:default}
.opt .hid{font-family:var(--f-ui);font-size:15px;color:var(--muted)}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--print);display:grid;place-items:center;font:600 14px/1 var(--f-num);color:var(--print)}
.opt.picked .bub{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.opt.picked.anim .bub{animation:fill .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{0%{transform:scale(.7);background:transparent;color:var(--print)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{font:600 13px/1.2 var(--f-ui);white-space:nowrap}
.opt.right .mk{color:var(--good)}
.opt.wrong .mk{color:var(--bad)}
.explain{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700;font-size:17px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.verdict.ok{color:var(--good)}
.verdict.ng{color:var(--bad)}
.verdict .ans{font:500 14px/1 var(--f-num);color:var(--muted)}
.explain p{margin:8px 0 0}
.explain .full{font-size:18px;line-height:2.1}
.explain .zh{color:var(--muted);font-size:15px}
.explain .tip{font-size:15px}
.qnav{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--ink);border-radius:999px;padding:12px 22px;font-weight:600;font-size:16px;cursor:pointer;background:var(--ink);color:var(--sheet)}
.btn.alt{background:var(--sheet);color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--print)}
.btn.sm{padding:8px 16px;font-size:14px}

/* Results */
.score{padding:20px 16px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.big{font:600 56px/1 var(--f-num);font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--muted)}
.score .msg2{flex:1;min-width:180px}
.score .msg2 b{display:block;font-size:18px}
.score .msg2 span{color:var(--muted);font-size:14px}
.parts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.parts span{font:500 13px/1 var(--f-num);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-variant-numeric:tabular-nums}
.parts span em{font-style:normal;font-family:var(--f-jp)}
.rlist details{border-bottom:1px solid var(--line)}
.rlist details:last-child{border-bottom:0}
.rlist summary{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;list-style:none}
.rlist summary::-webkit-details-marker{display:none}
.rlist .g{font-weight:700}
.rlist .g.ok{color:var(--good)}
.rlist .g.ng{color:var(--bad)}
.rlist .s{font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rlist .s em{font-style:normal;font-family:var(--f-ui);font-size:12px;color:var(--print);margin-right:6px}
.rlist .r{font:500 12px/1.3 var(--f-num);color:var(--muted);text-align:right;white-space:nowrap}
.rx{padding:0 16px 14px 50px;font-size:15px}
.rx p{margin:4px 0 0}
.rx .full{font-size:17px;line-height:2}
.rx .zh{color:var(--muted)}

/* Flashcards */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.chip small{font-family:var(--f-num);margin-left:4px;opacity:.75}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--print)}
.fcard{min-height:310px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:36px 20px 28px;cursor:pointer;position:relative;gap:8px;background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--print-soft) 35px 36px)}
.fpos{color:var(--print);font-size:14px}
.fword{font-family:var(--f-kyo);font-weight:600;font-size:clamp(40px,12vw,60px);line-height:1.2;overflow-wrap:anywhere}
.fread{font-family:var(--f-jp);font-size:22px;color:var(--print)}
.fzh{font-size:24px;font-weight:700}
.fex{font-size:17px;line-height:2;max-width:30ch}
.fex small{display:block;font-family:var(--f-ui);color:var(--muted);font-size:14px;line-height:1.5}
.hint{font-size:14px;color:var(--muted)}
.say{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;cursor:pointer}
.say svg{width:18px;height:18px;fill:var(--print)}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtns .btn{width:100%}
.done-card{padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done-card p{margin:0}
.done-card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Grammar reference */
.search{display:block;width:100%;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--sheet);font-size:16px}
.search:focus{outline:2px solid var(--print);outline-offset:1px}
.glist details{border-bottom:1px solid var(--line)}
.glist details:last-child{border-bottom:0}
.glist summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:11px 16px;cursor:pointer;list-style:none}
.glist summary::-webkit-details-marker{display:none}
.glist summary b{font-family:var(--f-jp);font-weight:600;font-size:18px}
.glist summary span{grid-column:1 / -1;color:var(--muted);font-size:15px;min-width:0}
.glist summary i{grid-row:1;grid-column:2;font-style:normal;font-size:12px;color:var(--print);white-space:nowrap}
.gx{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.gx .row{display:grid;grid-template-columns:3.5em 1fr;gap:8px;font-size:15px}
.gx .row > span:first-child{color:var(--print);font-size:13px;padding-top:2px}
.gx .ex{font-size:17px;line-height:2}
.gx .ex small{display:block;font-family:var(--f-ui);color:var(--muted);font-size:14px;line-height:1.5}
.gx .warn{background:var(--print-soft);border-radius:4px;padding:6px 10px;font-size:14px}
.empty{padding:20px 16px;color:var(--muted);text-align:center}
.say-sm{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);cursor:pointer;vertical-align:middle;margin-left:6px}
.say-sm svg{width:14px;height:14px;fill:var(--print)}

/* Exam info */
.itable{width:100%;border-collapse:collapse;font-size:15px}
.itable th,.itable td{border-bottom:1px solid var(--line);padding:9px 16px;text-align:left;vertical-align:top}
.itable tr:last-child th,.itable tr:last-child td{border-bottom:0}
.itable th{font-weight:600;white-space:nowrap;color:var(--print);font-size:14px;width:1%}
.itable td small{display:block;color:var(--muted);font-size:13px}
.types{margin:0;padding:10px 16px 12px 36px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.types li::marker{color:var(--print)}
.types [lang="ja"]{font-weight:600}
.warnbox{border:1px solid var(--bad);background:var(--bad-soft);border-radius:6px;padding:12px 16px;font-size:15px}
.warnbox b{color:var(--bad)}
.src{font-size:13px;color:var(--muted);margin:0;padding:10px 16px 14px;border-top:1px solid var(--line)}
.src a{word-break:break-all}

/* Word lookup: Japanese words can be tapped for the Chinese meaning */
.w{cursor:pointer;border-radius:2px;-webkit-tap-highlight-color:transparent}
.w.saved{text-decoration:underline dotted var(--print);text-decoration-thickness:1.5px;text-underline-offset:5px}
.w.on{background:var(--lead);color:var(--lead-ink);box-shadow:0 0 0 2px var(--lead);text-decoration:none}
.w.on rt{color:var(--lead-ink)}
[data-look="off"] .w,[data-look="pre"] :is(.opts,.tg,.word) .w{cursor:inherit}
.lookhint{margin:0;font-size:13px;color:var(--muted);text-align:center}
.wpop{position:fixed;z-index:30;width:340px;max-width:calc(100vw - 24px);background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.18);overflow:hidden;font-family:var(--f-ui)}
.wpop[hidden]{display:none}
.wp-band{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--print);color:var(--sheet);font:600 14px/1 var(--f-form);letter-spacing:.08em;padding-left:16px;min-height:38px}
.wp-x{width:44px;height:38px;border:0;background:none;color:inherit;font-size:16px;cursor:pointer}
.wp-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;max-height:min(62vh,480px);overflow:auto}
.wp-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wp-word{font:600 28px/1.25 var(--f-kyo);overflow-wrap:anywhere}
.wp-yomi{display:block;font-family:var(--f-jp);color:var(--print);font-size:16px;margin-top:2px}
.wp-say{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;cursor:pointer}
.wp-say svg{width:18px;height:18px;fill:var(--print)}
.wp-form{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline}
.wp-form [lang="ja"]{color:var(--ink);font-size:15px;font-family:var(--f-jp)}
.wp-steps{flex-basis:100%;color:var(--print)}
.wp-zh{font-size:20px;font-weight:700;line-height:1.4}
.wp-note{margin:0;font-size:15px;line-height:1.6}
.wp-ex{margin:2px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:16px;line-height:1.9}
.wp-ex small{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.wp-sub{margin:2px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap}
.wp-sub b{color:var(--ink);font-family:var(--f-jp)}
.wp-act{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.wp-save{display:inline-flex;align-items:center;gap:8px;min-height:38px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--ink);padding:6px 14px 6px 8px;font-size:14px;cursor:pointer}
.wp-save:hover{border-color:var(--print)}
.wp-save i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--print);flex:none}
.wp-save[aria-pressed="true"] i{background:var(--lead);border-color:var(--lead)}
.wp-save.anim i{animation:wfill .32s cubic-bezier(.2,.8,.2,1)}
.wp-more{font-size:13px;color:var(--muted)}
@keyframes wfill{from{transform:scale(.4)}to{transform:none}}
@keyframes sheet-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
/* Phone: the card rises from the bottom like a sheet; larger screens get a card beside the word */
@media (max-width:639px){
  .wpop{left:0;right:0;bottom:0;width:auto;max-width:none;border-radius:12px 12px 0 0;border-width:1px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:sheet-up .22s cubic-bezier(.2,.8,.2,1)}
  .wp-body{max-height:55vh}
}

/* Keyboard hints only where there is a keyboard and mouse */
@media (hover:hover) and (pointer:fine){
  .kbd{display:block}
  .w:hover{text-decoration:underline dotted var(--print);text-decoration-thickness:1.5px;text-underline-offset:5px}
  [data-look="off"] .w:hover,[data-look="pre"] :is(.opts,.tg,.word) .w:hover{text-decoration:none}
}

/* Tablet: wider sheet, practice modes in two columns */
@media (min-width:640px){
  .wrap{max-width:760px;padding:28px 24px 32px;gap:20px}
  .home-main,.home-side{gap:20px}
  .modes{display:grid;grid-template-columns:1fr 1fr}
  .modes .mode{border-bottom:1px solid var(--line)}
  .modes .mode.primary{grid-column:1 / -1}
  .modes .mode:not(.primary):nth-child(odd){border-right:1px solid var(--line)}
  .modes .mode:not(.primary) .go{display:none}
  .modes .mode:not(.primary):last-child:nth-child(odd){grid-column:1 / -1;border-right:0}
  .home-side{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .qcard{padding:20px 24px}
  .prompt{font-size:21px}
  .fcard{min-height:360px}
  .opts.grid2{display:grid;grid-template-columns:1fr 1fr}
  .wrap[data-view="result"]{max-width:860px}
  .wrap[data-view="info"]{max-width:860px}
}

/* Desktop: home in two columns; reading like the test book, passage left and answers right */
@media (min-width:1024px){
  .wrap[data-view="home"]{max-width:1120px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
  .wrap[data-view="home"] .home-side{display:flex;position:sticky;top:24px}
  .wrap[data-view="home"] .prefs{grid-column:1 / -1;margin-bottom:-8px}
  .wrap[data-view="quiz-p"]{max-width:1180px}
  .qcard.has-p{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start;overflow:visible;padding:24px}
  .qcard.has-p .passage{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;margin:0}
  .wrap[data-view="grammar"]{max-width:900px}
  .wrap[data-view="info"]{max-width:1000px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .wrap[data-view="info"] > .qtop,.wrap[data-view="info"] > .prefs{grid-column:1 / -1}
  .info-col{display:flex;flex-direction:column;gap:20px;min-width:0}
}
.info-col{display:flex;flex-direction:column;gap:16px;min-width:0}

@media (max-width:400px){
  .mode{grid-template-columns:62px 1fr}
  .mode .go{display:none}
  .stat{padding:10px 12px}
  .prompt{font-size:19px}
  .count b{font-size:38px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
/* Today panel: streak, daily goal, phase advice and today's tasks */
.today .goal{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.streak,.goal-n{font-size:14px;color:var(--muted)}
.streak b,.goal-n b{font:600 22px/1 var(--f-num);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.goal-n small{font-size:12px}
.goal-set{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.goal-set span{margin-right:2px}
.goal-set .chip{padding:3px 11px;font:600 13px/1.4 var(--f-num)}
.phase{margin:0;font-size:14px;line-height:1.55;background:var(--print-soft);border-radius:4px;padding:8px 10px}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{border-bottom:1px solid var(--line)}
.tasks li:last-child{border-bottom:0}
.tasks button{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;width:100%;padding:11px 16px;border:0;background:none;text-align:left;cursor:pointer}
.tasks button:hover:not([disabled]){background:var(--print-soft)}
.tasks button[disabled]{cursor:default}
.tk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--print);display:grid;place-items:center;font:600 12px/1 var(--f-num);color:var(--print)}
.tasks .tx{min-width:0}
.tasks .tx b{display:block;font-size:16px;line-height:1.35}
.tasks .tx small{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:1px}
.tasks .go{font:600 20px/1 var(--f-form);color:var(--print)}
.tasks li.done .tk{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.tasks li.done .tx b{color:var(--muted);text-decoration:line-through}
.tasks li.done .go,.tasks button[disabled] .go{opacity:.35}

/* Mock history */
.hist{display:flex;gap:8px;padding:14px 16px 12px;align-items:flex-end}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.hb .col{width:100%;max-width:34px;height:80px;background:var(--print-soft);border-radius:3px;display:flex;align-items:flex-end;overflow:hidden}
.hb .col i{display:block;width:100%;background:var(--print)}
.hb b{font:600 13px/1.2 var(--f-num)}
.hb small{font-size:11px;color:var(--muted);line-height:1.3;white-space:nowrap}
.hb em{font:normal 600 11px/1.3 var(--f-num);white-space:nowrap}
.hb em.ok{color:var(--good)}
.hb em.ng{color:var(--bad)}

/* Score estimate */
.est{padding:6px 16px 14px;border-bottom:1px solid var(--line)}
.est table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.est th,.est td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.est th:first-child{text-align:left;white-space:normal;padding-left:0}
.est td:last-child,.est th:last-child{padding-right:0}
.est thead th{font-weight:600;font-size:12px;color:var(--print)}
.est tbody th{font-weight:600;font-size:14px}
.est td.ok b{color:var(--good)}
.est td.ng b{color:var(--bad)}
.est td.ok,.est td.ng{font-family:var(--f-num)}
.est td.na{color:var(--muted);text-align:left}
.est tr.tot th,.est tr.tot td{border-bottom:0;font-weight:700}
.verdict-line{margin:10px 0 2px;font-weight:700;font-size:17px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.verdict-line.ok{color:var(--good)}
.verdict-line.ng{color:var(--bad)}
.verdict-line small{font-weight:400;font-size:14px;color:var(--muted)}
.est .note{margin:6px 0 0;font-size:13px}

/* 完整模考: the screen between sections */
.fullbreak{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.fb-msg{margin:0;font-size:15px;line-height:1.65}
.secs{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.secs li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.secs li:last-child{border-bottom:0}
.secs li b{font-weight:600;font-size:15px}
.secs li span{font:500 13px/1.6 var(--f-num);color:var(--muted);text-align:right;white-space:nowrap}
.secs li em{grid-column:1 / -1;font-style:normal;font-size:13px;color:var(--muted)}
.secs li.cur{background:var(--print-soft)}
.secs li.cur em{color:var(--print);font-weight:600}
.fullbreak .row{display:flex;justify-content:flex-end}
.qcount .tl.warn{color:var(--bad);font-weight:600}
.unans{margin:0;display:flex;align-items:center;justify-content:flex-end;gap:8px 12px;flex-wrap:wrap;font-size:14px;color:var(--bad)}
.unans .btn-ghost{color:var(--ink)}
.strip button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11px/1 var(--f-num);color:var(--muted);background:var(--sheet);padding:0;cursor:pointer}
.strip button:hover{border-color:var(--print)}
.strip button.done{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.strip button.cur{border-color:var(--print);color:var(--print);box-shadow:0 0 0 3px var(--print-soft)}
.strip button.cur.done{color:var(--lead-ink)}
@media (pointer:coarse){.strip button{width:32px;height:32px;font-size:12px}}
.btn-ghost[aria-expanded="true"]{background:var(--print-soft);border-color:var(--print);color:var(--print)}

/* Grammar cards in 今日複習 */
.gword{font-family:var(--f-jp);font-size:clamp(28px,8vw,40px)}
.fconn{font-size:15px;display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap;justify-content:center}
.fconn span:first-child{color:var(--print);font-size:13px}
.ftip{font-size:14px;line-height:1.55;background:var(--print-soft);border-radius:4px;padding:6px 10px;max-width:34ch;text-align:left}
.ftag{position:absolute;top:14px;left:14px;font:600 12px/1 var(--f-ui);color:var(--print);border:1px solid var(--print);border-radius:999px;padding:4px 9px}

/* 題型攻略 */
.guide{margin-top:8px}
.guide summary{display:inline-block;font-size:13px;color:var(--print);cursor:pointer;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary::before{content:"＋ "}
.guide[open] summary::before{content:"－ "}
.gd{margin:6px 0 2px;font-size:14px;line-height:1.6;color:var(--ink)}
.gd dt{font-weight:700;color:var(--print);font-size:13px;margin-top:8px}
.gd dt:first-child{margin-top:0}
.gd dd{margin:2px 0 0}
.gd ul{margin:0;padding-left:1.2em}
.gd li{margin:2px 0}
.guide-box{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin:0 0 14px}
.trow > .btn{align-self:start;margin-top:4px}

/* Listening script: replay one line */
.lp{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--print);padding:0;margin-right:6px;cursor:pointer;vertical-align:middle;position:relative;top:-1px}
.lp svg{width:11px;height:11px;fill:currentColor}
.lp:hover{border-color:var(--print)}
</style>
</head>

</footer>

<script>
/* ================= 點字查詢：日中小字典 =================
   一行一個詞：見出し(/其他寫法)|読み|類別|中文|說明。類別說明在下面 buildDict 上方。
   新增題目後，在瀏覽器主控台執行 dictMissing() 可以列出字典裡還找不到的片段。 */
const JDICT_SRC = `
# 助詞・助動詞・指示詞・接續詞・寒暄
は|は|prt|（主題）…呢、…是|標示句子的主題，這時念 wa。
が|が|prt|（主語）；但是|標示主語；「〜が好き」「〜がほしい」「〜ができる」也用が。接在句子後面時是「但是」。
を|を|prt|（動作的對象）|標示動詞的受詞，念 o。也用在離開、經過的地方：「家を出る」「道を渡る」。
に|に|prt|在、到、給、向|時間點、目的地、存在的地方、動作的對象：「7時に起きる」「学校に行く」「友達に会う」。
へ|へ|prt|往、向|表示方向，念 e，和「に」的用法接近。
で|で|prt|在；用；因為|動作發生的地方、手段或工具、原因：「図書館で勉強する」「バスで行く」「風邪で休む」。

よ|よ|prt|…喔、…啦|句尾，告訴對方不知道的事或提醒對方。

# 文法題的選項片段
ら|ら|gram|（〜たら的ら）…之後；如果…|接在た形後面：「着いたら」到了之後。

ば|ば|gram|如果…的話|ば形的結尾：「行けば」「安ければ」。
なら|なら|prt|如果是…的話|接對方的話題給建議：「日本へ行くなら、京都がいいですよ」。
ても|ても|gram|即使…也|接在て形的位置。
たり|たり|gram|…啦…啦（舉例動作）|「〜たり〜たりする」。

function deinflect(src){
  const out = [{t: src, req: null, chain: []}];
  for (let k = 0; k < out.length && out.length < 400; k++){
    const d = out[k];
    if (d.chain.length >= 6 || d.bare === 2) continue;
    for (const r of DE_RULES){
      if (r.i && !d.t.endsWith(r.i)) continue;
      if (!r.i && !(d.req ? d.req.includes("stem") : HAS_KANJI.test(src))) continue;
      if (r.kanji && (d.req || !HAS_KANJI.test(src))) continue;
      if (d.req && !r.x.some(c => d.req.includes(c))) continue;
      if (d.bare && !r.vform) continue;   // a bare stem may only be a 可能・被動・使役 verb
      const t = d.t.slice(0, d.t.length - r.i.length) + r.o;
      if (!t) continue;
      out.push({t, req: r.b, chain: [r, ...d.chain], bare: !d.req && !r.i ? 1 : (!d.req && r.kanji) || d.bare ? 2 : 0});

}

}

  {id:"r5", type:"chu", title:"{初:はじ}めてのお{弁当:べんとう}", body:[
    "{私:わたし}は{日本:にほん}に{来:き}てから、{毎日:まいにち}コンビニで{昼:ひる}ご{飯:はん}のお{弁当:べんとう}を{買:か}っていました。コンビニのお{弁当:べんとう}は{便利:べんり}でおいしいですが、{毎日:まいにち}{買:か}うとお{金:かね}がたくさんかかります。",
    "それで、{先月:せんげつ}から{自分:じぶん}でお{弁当:べんとう}を{作:つく}ることにしました。でも、{朝:あさ}は{時間:じかん}がないので、{前:まえ}の{晩:ばん}に{作:つく}っておきます。{最初:さいしょ}は{卵焼:たまごや}きも{上手:じょうず}に{作:つく}れませんでしたが、{隣:となり}の{部屋:へや}の{佐藤:さとう}さんが{作:つく}り{方:かた}を{教:おし}えてくれました。",
    "{自分:じぶん}で{作:つく}ると、{好:す}きなものを{入:い}れることができますし、{野菜:やさい}もたくさん{食:た}べられます。{一:いっ}か{月:げつ}で{一万円:いちまんえん}ぐらいお{金:かね}も{残:のこ}りました。{来月:らいげつ}は、{残:のこ}ったお{金:かね}で{佐藤:さとう}さんと{一緒:いっしょ}に{食事:しょくじ}に{行:い}こうと{思:おも}っています。"],
   zh:"我來日本以後，每天都在便利商店買午餐便當。便利商店的便當方便又好吃，但每天買很花錢。所以上個月開始決定自己做便當。不過早上沒時間，所以前一天晚上先做好。一開始連玉子燒都做不好，隔壁房間的佐藤小姐教了我做法。自己做可以放喜歡的東西，也能吃很多蔬菜。一個月還省下大約一萬日圓。下個月打算用省下來的錢和佐藤小姐一起去吃飯。",
   qs:[
    {q:"この{人:ひと}はどうして{自分:じぶん}でお{弁当:べんとう}を{作:つく}ることにしましたか。", o:["コンビニのお{弁当:べんとう}を{毎日:まいにち}{買:か}うと、お{金:かね}がかかるから","コンビニのお{弁当:べんとう}がおいしくなかったから","{佐藤:さとう}さんに{料理:りょうり}を{習:なら}いたかったから","{朝:あさ}、{時間:じかん}がたくさんあるから"], note:"第一段：便利商店便當方便又好吃，但每天買很花錢 →「それで」決定自己做。"},

  {id:"r6", type:"chu", title:"{図書館:としょかん}のボランティア", body:[
    "{私:わたし}は{毎週:まいしゅう}{土曜日:どようび}、{近:ちか}くの{図書館:としょかん}でボランティアをしています。{子:こ}どもたちに{絵本:えほん}を{読:よ}む{仕事:しごと}です。{最初:さいしょ}は{日本語:にほんご}の{発音:はつおん}が{心配:しんぱい}でしたが、{図書館:としょかん}の{人:ひと}が「ゆっくり{読:よ}めば{大丈夫:だいじょうぶ}ですよ」と{言:い}ってくれました。",

    "{絵本:えほん}を{読:よ}む{前:まえ}には、{知:し}らない{言葉:ことば}を{辞書:じしょ}で{調:しら}べたり、{何回:なんかい}も{声:こえ}に{出:だ}して{練習:れんしゅう}したりします。{大変:たいへん}ですが、このボランティアのおかげで、{日本語:にほんご}を{話:はな}すことが{前:まえ}よりずっと{好:す}きになりました。"],
   zh:"我每週六在附近的圖書館當志工，工作是念繪本給小朋友聽。一開始擔心日文發音，圖書館的人對我說「慢慢念就沒問題喔」。小朋友知道我從台灣來，就很想聽台灣的故事。所以上個月我用日文念了台灣的民間故事。小朋友非常開心，說「再一次！」。念繪本之前，我會查不懂的字、出聲練習很多次。雖然辛苦，但多虧這份志工，我比以前更喜歡說日文了。",
   qs:[
    {q:"{図書館:としょかん}の{人:ひと}はこの{人:ひと}に{何:なん}と{言:い}いましたか。", o:["ゆっくり{読:よ}めば{問題:もんだい}ない","{発音:はつおん}をもっと{練習:れんしゅう}したほうがいい","{台湾:たいわん}の{話:はなし}をしてほしい","{子:こ}どもたちに{日本語:にほんご}を{教:おし}えてほしい"], note:"「ゆっくり読めば大丈夫ですよ」＝慢慢念就沒問題。"},

    ["f","うん。でも、その{前:まえ}に{銀行:ぎんこう}でお{金:かね}を{下:お}ろしたいんだけど、いい？"],
    ["m","いいよ。じゃ、そうしよう。"]],
   o:["{銀行:ぎんこう}でお{金:かね}を{下:お}ろす","チケットを{買:か}う","ご{飯:はん}を{食:た}べる","{映画:えいが}を{見:み}る"],
   zh:"男：電影是幾點開始來著？女：四點半，還有一個小時左右。男：那先去買票吧？女：票已經用手機買好了。男：這樣啊，那去吃點東西吧，肚子餓了。女：好。不過在那之前我想先去銀行領錢，可以嗎？男：好啊，就這樣吧。", note:"票已經買好；吃飯「その前に」要先去銀行領錢。"},
  {id:"l1-5", type:"kadai", intro:"{病院:びょういん}の{受付:うけつけ}で{男:おとこ}の{人:ひと}と{受付:うけつけ}の{人:ひと}が{話:はな}しています。", q:"{男:おとこ}の{人:ひと}はこのあとまず{何:なに}をしますか。", lines:[
    ["m","すみません、ここは{初:はじ}めてなんですが。"],
    ["f","はい。では、まずこの{紙:かみ}にお{名前:なまえ}とご{住所:じゅうしょ}を{書:か}いてください。{保険証:ほけんしょう}はお{持:も}ちですか。"],
    ["m","はい、これです。"],
    ["f","ありがとうございます。{書:か}き{終:お}わったら、{熱:ねつ}を{測:はか}ってから、あちらでお{待:ま}ちください。"],
    ["m","わかりました。"]],
   o:["{紙:かみ}に{名前:なまえ}と{住所:じゅうしょ}を{書:か}く","{保険証:ほけんしょう}を{出:だ}す","{熱:ねつ}を{測:はか}る","いすに{座:すわ}って{待:ま}つ"],
   zh:"男：不好意思，我是第一次來。櫃台：好的。請先在這張紙上寫姓名和地址。有帶健保卡嗎？男：有，在這裡。櫃台：謝謝。寫完之後量體溫，再到那邊等候。男：好的。", note:"健保卡已經交了；「まず」寫姓名地址，寫完才量體溫、等候。"},
  {id:"l1-6", type:"kadai", intro:"{家:いえ}で{女:おんな}の{人:ひと}と{男:おとこ}の{人:ひと}が{話:はな}しています。", q:"{女:おんな}の{人:ひと}は{何:なに}を{買:か}ってきますか。", lines:[
    ["f","スーパーに{行:い}ってくるけど、{何:なに}か{要:い}るものある？"],
    ["m","{牛乳:ぎゅうにゅう}がなかったと{思:おも}う。"],
    ["f","{牛乳:ぎゅうにゅう}は{昨日:きのう}{買:か}ったよ。{冷蔵庫:れいぞうこ}の{奥:おく}にあるよ。"],
    ["m","あ、ほんとだ。じゃ、{卵:たまご}は？"],
    ["f","{卵:たまご}もまだあるね。"],
    ["m","じゃあ、パンを{買:か}ってきて。{明日:あした}の{朝:あさ}の{分:ぶん}がないから。"],
    ["f","わかった。パンね。"]],
   o:["パン","{牛乳:ぎゅうにゅう}","{卵:たまご}","{牛乳:ぎゅうにゅう}とパン"],
   zh:"女：我要去超市，有需要買什麼嗎？男：牛奶好像沒了。女：牛奶昨天買了，在冰箱裡面。男：啊，真的耶。那蛋呢？女：蛋也還有。男：那買麵包回來，明天早上的份沒了。女：好，麵包。", note:"牛奶、蛋都還有，最後決定買麵包。"},
  {id:"l2-1", type:"point", intro:"{男:おとこ}の{学生:がくせい}と{女:おんな}の{学生:がくせい}が{話:はな}しています。", q:"{女:おんな}の{学生:がくせい}はどうして{昨日:きのう}のパーティーに{行:い}きませんでしたか。", lines:[
    ["m","{昨日:きのう}のパーティー、{来:こ}なかったね。{風邪:かぜ}でもひいたの？"],
    ["f","ううん、{元気:げんき}だよ。{行:い}きたかったんだけど、アルバイトの{人:ひと}が{一人:ひとり}{休:やす}んじゃって、{代:か}わりに{働:はたら}くことになったの。"],
    ["m","そうだったんだ。{大変:たいへん}だったね。"],
    ["f","うん。でも、お{金:かね}はたくさんもらえたから。"]],
   o:["アルバイトに{行:い}かなければならなかったから","{風邪:かぜ}をひいたから","パーティーが{好:す}きじゃないから","お{金:かね}がなかったから"],
   zh:"男：妳昨天沒來派對耶，感冒了嗎？女：沒有，我很好。本來想去，可是打工有一個人請假，我變成要代班。男：原來如此，辛苦了。女：嗯，不過領到不少錢。", note:"「代わりに働くことになった」＝變成要去代班打工。"},
  {id:"l2-2", type:"point", intro:"{女:おんな}の{人:ひと}と{男:おとこ}の{人:ひと}が{話:はな}しています。", q:"{男:おとこ}の{人:ひと}は{週末:しゅうまつ}{何:なに}をしましたか。", lines:[
    ["f","{週末:しゅうまつ}、どこか{行:い}きましたか。"],
    ["m","{本当:ほんとう}は{友達:ともだち}と{海:うみ}へ{行:い}く{予定:よてい}だったんですが、{雨:あめ}で{行:い}けなかったんです。"],
    ["f","{残念:ざんねん}でしたね。じゃあ、{家:いえ}でゆっくりしましたか。"],
    ["m","いいえ、{友達:ともだち}と{一緒:いっしょ}に{映画館:えいがかん}で{映画:えいが}を{見:み}ました。そのあと、{友達:ともだち}の{家:いえ}で{料理:りょうり}を{作:つく}って{食:た}べました。"]],
   o:["{映画:えいが}を{見:み}て、{友達:ともだち}の{家:いえ}で{料理:りょうり}を{作:つく}った","{友達:ともだち}と{海:うみ}へ{行:い}った","{家:いえ}でゆっくりした","{一人:ひとり}で{映画:えいが}を{見:み}た"],
   zh:"女：週末有去哪裡嗎？男：本來要和朋友去海邊，但因為下雨沒去成。女：好可惜。那在家休息了嗎？男：沒有，和朋友去電影院看電影，之後在朋友家做菜吃。", note:"海邊因為下雨沒去；在家休息被否定（いいえ）。"},
  {id:"l2-3", type:"point", intro:"{男:おとこ}の{人:ひと}と{女:おんな}の{人:ひと}が{話:はな}しています。", q:"{女:おんな}の{人:ひと}は{今:いま}、どうやって{会社:かいしゃ}に{来:き}ていますか。", lines:[
    ["m","{鈴木:すずき}さんの{家:いえ}から{会社:かいしゃ}まで{遠:とお}いですよね。{電車:でんしゃ}ですか。"],
    ["f","{前:まえ}は{電車:でんしゃ}でしたが、{今:いま}は{自転車:じてんしゃ}で{来:き}ています。"],
    ["m","え、{自転車:じてんしゃ}で？{大変:たいへん}でしょう。"],
    ["f","{駅:えき}まではバスで{行:い}って、そこから{自転車:じてんしゃ}なんです。{電車:でんしゃ}はいつも{込:こ}んでいるので。"]],
   o:["バスと{自転車:じてんしゃ}","{電車:でんしゃ}","{自転車:じてんしゃ}だけ","バスと{電車:でんしゃ}"],
   zh:"男：鈴木小姐家離公司很遠吧，搭電車嗎？女：以前搭電車，現在騎腳踏車來。男：咦，騎腳踏車？很辛苦吧。女：到車站是搭公車，從那裡開始騎腳踏車。因為電車總是很擠。", note:"以前電車；現在「バスで行って、そこから自転車」。"},
  {id:"l2-4", type:"point", intro:"{電話:でんわ}で{男:おとこ}の{人:ひと}と{女:おんな}の{人:ひと}が{話:はな}しています。", q:"{二人:ふたり}は{何時:なんじ}にどこで{会:あ}いますか。", lines:[
    ["m","もしもし、{明日:あした}のことなんだけど、{十時:じゅうじ}に{駅:えき}の{改札:かいさつ}の{前:まえ}でいい？"],
    ["f","ごめん、{午前中:ごぜんちゅう}は{用事:ようじ}があって、{十一時半:じゅういちじはん}まで{行:い}けないの。"],
    ["m","そう。じゃあ、{十二時:じゅうにじ}にしようか。"],
    ["f","うん。{場所:ばしょ}は{駅:えき}の{前:まえ}の{本屋:ほんや}でもいい？{少:すこ}し{見:み}たい{本:ほん}があるから。"],
    ["m","いいよ。じゃ、{十二時:じゅうにじ}に{本屋:ほんや}で。"]],
   o:["{十二時:じゅうにじ}に{本屋:ほんや}で","{十時:じゅうじ}に{改札:かいさつ}の{前:まえ}で","{十一時半:じゅういちじはん}に{本屋:ほんや}で","{十二時:じゅうにじ}に{改札:かいさつ}の{前:まえ}で"],
   zh:"男：喂，關於明天，十點在車站剪票口前面可以嗎？女：抱歉，上午有事，十一點半以前到不了。男：這樣啊，那改十二點吧。女：好。地點改在車站前的書店可以嗎？我有本書想看一下。男：好啊，那十二點在書店。", note:"時間和地點都改了：十二點、書店。"},
  {id:"l2-5", type:"point", intro:"{女:おんな}の{人:ひと}と{男:おとこ}の{人:ひと}が{話:はな}しています。", q:"{男:おとこ}の{人:ひと}はどうして{引:ひ}っ{越:こ}しますか。", lines:[
    ["f","{来月:らいげつ}、{引:ひ}っ{越:こ}すんですって？{今:いま}の{部屋:へや}、{駅:えき}から{近:ちか}くて{便利:べんり}だって{言:い}っていましたよね。"],
    ["m","ええ、{便利:べんり}なんですけど、{隣:となり}の{部屋:へや}の{人:ひと}が{夜:よる}{遅:おそ}くまでうるさくて、よく{眠:ねむ}れないんです。"],
    ["f","それは{大変:たいへん}ですね。{家賃:やちん}は？"],
    ["m","{今度:こんど}の{部屋:へや}のほうが{少:すこ}し{高:たか}いんですが、しかたないです。"]],
   o:["{隣:となり}の{人:ひと}がうるさいから","{家賃:やちん}が{高:たか}いから","{駅:えき}から{遠:とお}いから","{会社:かいしゃ}が{変:か}わるから"],
   zh:"女：聽說你下個月要搬家？你說現在的房間離車站近很方便吧。男：是很方便，但隔壁的人吵到很晚，常常睡不好。女：那真辛苦。房租呢？男：新的房間稍微貴一點，不過沒辦法。", note:"「〜けど」後面是真正的理由：隔壁太吵睡不好。"},
  {id:"l2-6", type:"point", intro:"{男:おとこ}の{人:ひと}と{女:おんな}の{人:ひと}が{話:はな}しています。", q:"{女:おんな}の{人:ひと}はどんな{料理:りょうり}を{習:なら}いたいと{言:い}っていますか。", lines:[
    ["m","{料理:りょうり}{教室:きょうしつ}に{通:かよ}うんですか。{何:なに}を{習:なら}うんですか。"],
    ["f","{日本:にほん}の{料理:りょうり}です。すしや{天:てん}ぷらはレストランで{食:た}べられるので、{家:いえ}で{毎日:まいにち}{作:つく}れる{料理:りょうり}を{習:なら}いたいんです。"],
    ["m","じゃあ、みそ{汁:しる}とか？"],
    ["f","ええ、そういう{料理:りょうり}です。"]],
   o:["{家:いえ}で{毎日:まいにち}{作:つく}れる{日本:にほん}の{料理:りょうり}","すしや{天:てん}ぷら","レストランの{料理:りょうり}","{台湾:たいわん}の{料理:りょうり}"],
   zh:"男：妳要去上料理教室嗎？學什麼？女：日本料理。壽司、天婦羅在餐廳就吃得到，所以想學在家每天都能做的料理。男：像味噌湯那種？女：對，就是那樣的料理。", note:"壽司、天婦羅是「餐廳吃得到」的，被排除。"},
  {id:"l3-1", type:"hatsuwa", sit:"你在朋友家玩，現在要回家了。", ja:"{友達:ともだち}の{家:いえ}から{帰:かえ}ります。{何:なん}と{言:い}いますか。",
   o:["お{邪魔:じゃま}しました。","お{邪魔:じゃま}します。","いってきます。"], zh:"1 打擾了（離開時）／2 打擾了（進門時）／3 我出門了", note:"離開別人家說「お邪魔しました」；進門時說「お邪魔します」。"},
  {id:"l3-2", type:"hatsuwa", sit:"你在服飾店想試穿衣服。", ja:"{服:ふく}を{着:き}てみたいです。{店:みせ}の{人:ひと}に{何:なん}と{言:い}いますか。",
   o:["これ、{着:き}てみてもいいですか。","これ、{着:き}てみてください。","これ、{着:き}てもらいましょうか。"], zh:"1 這件可以試穿嗎？／2 請試穿這件。／3 要請人穿這件嗎？", note:"請求許可：「〜てもいいですか」。"},
  {id:"l3-3", type:"hatsuwa", sit:"你上課遲到，走進教室。", ja:"{授業:じゅぎょう}に{遅:おく}れました。{先生:せんせい}に{何:なん}と{言:い}いますか。",
   o:["{遅:おく}れて、すみません。","{遅:おく}れないでください。","お{待:ま}たせしましょうか。"], zh:"1 對不起，我遲到了。／2 請不要遲到。／3 要讓您等一下嗎？", note:"道歉：「〜て、すみません」。"},
  {id:"l3-4", type:"hatsuwa", sit:"朋友提著很重的行李，你想幫忙。", who:"m", ja:"{友達:ともだち}の{荷物:にもつ}が{重:おも}そうです。{何:なん}と{言:い}いますか。",
   o:["{一:ひと}つ{持:も}とうか。","{一:ひと}つ{持:も}ってくれる？","{重:おも}いから、{持:も}たないでね。"], zh:"1 我幫你拿一個吧？／2 可以幫我拿一個嗎？／3 很重，不要拿喔。", note:"主動幫忙：意向形「〜（よ）うか」。"},
  {id:"l3-5", type:"hatsuwa", sit:"同事送你點心，你要道謝。", ja:"{会社:かいしゃ}の{人:ひと}にお{菓子:かし}をもらいました。{何:なん}と{言:い}いますか。",
   o:["ありがとうございます。いただきます。","どういたしまして。","どうぞ、{召:め}し{上:あ}がってください。"], zh:"1 謝謝，那我就收下了。／2 不客氣。／3 請享用。", note:"收到東西：「ありがとうございます」；「どういたしまして」是回應別人道謝。"},
  {id:"l3-6", type:"hatsuwa", sit:"你在餐廳想點餐，要叫店員。", ja:"レストランで{注文:ちゅうもん}したいです。{何:なん}と{言:い}いますか。",
   o:["すみません、{注文:ちゅうもん}をお{願:ねが}いします。","いらっしゃいませ。","ご{注文:ちゅうもん}はお{決:き}まりですか。"], zh:"1 不好意思，我要點餐。／2 歡迎光臨。／3 您決定好要點什麼了嗎？", note:"2 和 3 是店員說的話。"},
  {id:"l4-1", type:"sokuji", line:["m","{明日:あした}、{一緒:いっしょ}に{昼:ひる}ご{飯:はん}を{食:た}べませんか。"],
   o:["いいですね。どこで{食:た}べましょうか。","はい、{食:た}べませんでした。","{昼:ひる}ご{飯:はん}はおいしかったです。"], zh:"明天要不要一起吃午餐？→ 好啊，要在哪裡吃？", note:"「〜ませんか」是邀請，回答接受或拒絕。"},
  {id:"l4-2", type:"sokuji", line:["f","すみません、ちょっとペンを{貸:か}してもらえませんか。"],
   o:["はい、どうぞ。","いいえ、{貸:か}しませんでした。","ペンを{借:か}りてもいいですよ。"], zh:"不好意思，可以借我一下筆嗎？→ 好，請用。", note:"「〜てもらえませんか」是請求，把東西遞過去說「どうぞ」。"},
  {id:"l4-3", type:"sokuji", line:["m","お{疲:つか}れさまでした。"],
   o:["お{疲:つか}れさまでした。また{明日:あした}。","はい、{疲:つか}れていません。","どういたしまして。"], zh:"辛苦了。→ 辛苦了，明天見。", note:"下班時互相說「お疲れさまでした」。"},
  {id:"l4-4", type:"sokuji", line:["f","{遅:おそ}くなってごめんね。だいぶ{待:ま}った？"],
   o:["ううん、{私:わたし}も{今:いま}{来:き}たところ。","うん、{待:ま}ってあげる。","じゃ、{待:ま}っててね。"], zh:"抱歉來晚了，等很久了嗎？→ 沒有，我也是剛到。", note:"「今来たところ」＝剛到。"},
  {id:"l4-5", type:"sokuji", line:["m","この{仕事:しごと}、{今日:きょう}じゅうにお{願:ねが}いできますか。"],
   o:["はい、やっておきます。","はい、お{願:ねが}いします。","いいえ、{今日:きょう}ではありません。"], zh:"這份工作今天之內可以麻煩你嗎？→ 好，我會做好。", note:"被拜託工作，回答「やっておきます」（會先做好）。"},
  {id:"l4-6", type:"sokuji", line:["f","{田中:たなか}さん、{顔色:かおいろ}が{悪:わる}いですね。"],
   o:["ええ、ちょっと{頭:あたま}が{痛:いた}くて。","ええ、とても{元気:げんき}です。","いいえ、{色:いろ}は{好:す}きじゃありません。"], zh:"田中先生，你臉色不太好耶。→ 嗯，頭有點痛。", note:"顔色が悪い＝臉色不好（看起來不舒服）。"},
  {id:"l4-7", type:"sokuji", line:["m","{窓:まど}を{開:あ}けてもいいですか。"],
   o:["ええ、どうぞ。","いいえ、{開:あ}けませんでした。","はい、{開:あ}きました。"], zh:"可以開窗嗎？→ 好，請。", note:"回應請求許可：「ええ、どうぞ」。"},
  {id:"l4-8", type:"sokuji", line:["f","{駅:えき}までどのくらいかかりますか。"],
   o:["{歩:ある}いて{十分:じゅっぷん}ぐらいです。","{電車:でんしゃ}で{来:き}ました。","{駅:えき}はあそこにありません。"], zh:"到車站要多久？→ 走路大約十分鐘。", note:"「どのくらいかかりますか」問花多少時間。"},
  {id:"l4-9", type:"sokuji", line:["m","{今度:こんど}の{日曜日:にちようび}、{何:なに}か{予定:よてい}ある？"],
   o:["ううん、{特:とく}にないよ。","うん、{日曜日:にちようび}だったよ。","{予定:よてい}を{立:た}ててください。"], zh:"這個星期天有什麼安排嗎？→ 沒有，沒特別的事。", note:"朋友之間的問句，用普通體回答。"},

/* 概要理解 and 統合理解 1・2番: the question and options are only heard, as in the real test.

const spokenQ = it => it.type === "gaiyo" || (it.type === "togoc" && !it.printed);
const spokenOpts = it => it.type === "hatsuwa" || it.type === "sokuji" || spokenQ(it);

function rows(src){ return src.split("\n").map(s => s.trim()).filter(s => s && !s.startsWith("#")); }
function parseQ(src, type){
  return rows(src).map(l => {
    const f = l.split("|"), it = {id:f[0], type, p:f[1], o:f[2].split(";"), zh:f[3] || "", note:f[4] || ""};
    /* 並べ替え options are written in sentence order, so the answer is the option that goes in the ★ slot */
    if (type === "narabe") it.ans = (f[1].match(/＿★＿|＿＿＿/g) || []).indexOf("＿★＿");
    return it;
  });
}
/* Index of the correct option: the first one, except for 並べ替え */
const ansOf = it => it.ans || 0;
/* Each level keeps its own items, vocabulary and grammar; useLevel() points the globals below at one of them.
   Item ids are unique across levels, so stats, the wrong list and 生字本 are shared in one store. */
const ALL_ITEMS = {};
/* Vocabulary: 單字|讀音|詞性|中文|例句|例句中文 */
const VCAT_OF = {"自動詞":"動詞","他動詞":"動詞","自他動詞":"動詞","い形容詞":"い形容詞","な形容詞":"な形容詞","名詞":"名詞","外來語":"外來語"};
const parseVocab = src => rows(src).map(l => { const f = l.split("|"); return {k:f[0], r:f[1], pos:f[2], cat:VCAT_OF[f[2]] || "副詞・其他", zh:f[3], ex:f[4], exzh:f[5]}; });
/* Grammar: 分類|文法|中文意思|接續|例句|例句中文|提醒 */
const parseGrammar = src => rows(src).map(l => { const f = l.split("|"); return {cat:f[0], g:f[1], zh:f[2], conn:f[3], ex:f[4], exzh:f[5], tip:f[6] || ""}; });
function buildLevel(L){
  const items = {}, by = {};
  Object.keys(L.types).forEach(t => by[t] = []);
  const add = it => {
    if (ALL_ITEMS[it.id]) console.warn("duplicate id", it.id);
    if (!by[it.type]){ console.warn("type not in this level", it.id, it.type); by[it.type] = []; }
    items[it.id] = ALL_ITEMS[it.id] = it; by[it.type].push(it);
  };
  Object.entries(L.q).forEach(([t, src]) => parseQ(src, t).forEach(add));
  L.passages.forEach(p => p.qs.forEach((q,k) => add({...q, id:`${p.id}-${k+1}`, type:p.type, passage:p, qi:k+1})));
  /* A listening entry with qs is one talk with several questions (統合理解 3番): each question becomes an item that shares the talk */
  L.listen.forEach(x => {
    if (!x.qs) return add({...x});
    x.qs.forEach((q,k) => { const it = {...x, ...q, id:`${x.id}-${k+1}`, grp:x.id, gi:k+1, gn:x.qs.length}; delete it.qs; add(it); });
  });
  return {...L, items, by, ids: Object.keys(items), vocab: parseVocab(L.vocabSrc), grammar: parseGrammar(L.grammarSrc)};
}

    if (!it.grp) return out.push(it);
    if (seen.has(it.grp)) return;
    seen.add(it.grp); pool.filter(x => x.grp === it.grp).sort((a,b) => a.gi - b.gi).forEach(x => out.push(x));
  });
  return out;
}
function pickPassages(type, maxQ){
  const ps = LV.passages.filter(p => p.type === type);
  const fresh = p => p.qs.every((q,k) => weight(`${p.id}-${k+1}`) === 0);
  const sorted = [...shuffle(ps.filter(fresh)), ...shuffle(ps.filter(p => !fresh(p)))];
  const out = [];
  for (const p of sorted){
    if (out.length && out.length + p.qs.length > maxQ) continue;
    p.qs.forEach((q,k) => out.push(ITEMS[`${p.id}-${k+1}`]));
    if (out.length >= maxQ) break;
  }
  return out;
}
function itemsForType(t, n){ return PASSAGE_TYPES.has(t) ? pickPassages(t, n || 8) : pickItems(BY_TYPE[t], n || 10); }
/* steps: [type, count]; "a|b" picks one of the types at random; for passage types the count is a number of questions */
function runSteps(steps){
  return steps.flatMap(([t, n]) => { const ts = t.split("|"), x = ts[Math.floor(Math.random() * ts.length)]; return PASSAGE_TYPES.has(x) ? pickPassages(x, n) : pickItems(BY_TYPE[x] || [], n); });
}
function buildMock(){
  const out = runSteps(LV.mock.lang);
  if (tts.ok) out.push(...runSteps(LV.mock.audio));
  return out;
}

/* ---------------- Quiz state ---------------- */
let view = "home", quiz = null, deck = null, gram = {q:"", cat:"全部"}, tick = null, curSec = "goi", pendingTask = null;
function startQuiz(mode, items, exam){
  stopSpeech();
  if (!items.length) return;
  quiz = { mode, exam: !!exam, i: 0, answers: {}, start: Date.now(), task: pendingTask,
           items: items.map(it => ({it, order: it.fixed ? it.fixed.slice() : shuffle(it.o.map((_,k) => k)), reveal: false})) };
  pendingTask = null;
  if (exam) startClock();
  renderQuiz(true);
}
function quizTitle(){
  const m = quiz.mode;
  if (m === "mock") return tx("迷你模考", "ミニ模試");
  if (m === "full"){ const s = quiz.sections[quiz.sec]; return tx("完整模考", "本番形式の模試") + (view !== "result" && s ? "・" + s.name : ""); }
  if (m.startsWith("type:")){ const T = TYPES[m.slice(5)]; return `${SECS[T.sec].name}・${T.name}`; }
  if (m.startsWith("sec:")) return `${SECS[m.slice(4)].name}・${tx("混合", "ミックス")}`;
  if (m === "wrong") return tx("錯題本", "間違えた問題");
  if (m === "retry") return tx("重練錯題", "間違いを復習");
  return tx("練習", "練習");
}
/* Exams: 完整模考 counts down each section and hands it in when time is up; the mini mock counts up */
const inExam = () => !!(quiz && quiz.exam && (view === "quiz" || view === "quiz-p" || view === "fullbreak"));
function secLeft(){ const s = quiz && quiz.sections && quiz.sections[quiz.sec]; return s && s.start ? s.min * 60000 - (Date.now() - s.start) : 0; }
function clockText(){ return quiz.full ? mmss(Math.max(0, secLeft())) : mmss(Date.now() - quiz.start); }
function startClock(){
  stopClock();
  tick = setInterval(() => {
    if (!quiz) return stopClock();
    const el = document.getElementById("clock");
    if (el){ el.textContent = clockText(); if (quiz.full) el.classList.toggle("warn", secLeft() < 5 * 60000); }
    if (quiz.full && view !== "fullbreak" && view !== "result" && secLeft() <= 0) endSection(true);
  }, 1000);
}
function stopClock(){ if (tick){ clearInterval(tick); tick = null; } }
function mmss(ms){ const s = Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function cur(){ return quiz.items[quiz.i]; }
/* The questions in play: the current section of 完整模考, otherwise the whole quiz */
function span(){ if (quiz.full){ const s = quiz.sections[quiz.sec]; return [s.from, s.to]; } return [0, quiz.items.length]; }
/* Practice records an answer at once; exams record answers when handed in, so they can be changed until then */
function commitAnswer(it, ok){
  const s = store.stats[it.id] || {r:0, w:0};
  if (ok) s.r++; else s.w++;
  s.last = ok ? 1 : 0;
  store.stats[it.id] = s;
  store.answered++; if (ok) store.correct++;
  const lg = todayLog(); lg.q++; if (ok) lg.ok++;
  const w = store.wrong.indexOf(it.id);
  if (!ok && w < 0) store.wrong.push(it.id);
  if (ok && w >= 0) store.wrong.splice(w, 1);
}
function select(disp){
  const q = cur(), it = q.it, a = quiz.answers[it.id];
  if (a && (!quiz.exam || a.pick === disp)) return;
  const ok = q.order[disp] === ansOf(it);
  quiz.answers[it.id] = {pick: disp, ok};
  if (!quiz.exam){ commitAnswer(it, ok); save(); if (AUDIO_TYPES.has(it.type)) stopSpeech(); }
  renderQuiz(false, true);
}
function next(){
  const [from, to] = span();
  if (quiz.exam && quiz.i >= to - 1){
    const miss = quiz.items.slice(from, to).filter(x => !quiz.answers[x.it.id]).length;
    if (miss && !confirm(tx(`還有 ${miss} 題沒作答，確定要交卷嗎？`, `未解答が ${miss} 問あります。提出しますか？`))) return;
  }
  stopSpeech();
  if (quiz.i < to - 1){ quiz.i++; renderQuiz(true); window.scrollTo(0,0); }
  else if (quiz.full) endSection(false);
  else { stopClock(); renderResult(true); }
}
function goHome(){ stopClock(); stopSpeech(); quiz = null; renderHome(); window.scrollTo(0,0); }

/* ---------------- Daily log, streak and today's tasks ----------------
   store.days["YYYY-MM-DD"] = {q: questions answered, ok: correct, c: cards reviewed, nv/ng: new cards per level, done: {"task:level": 1}}.
   Kept for 120 days. A day with any question or card keeps the streak going. */
function dayKey(d){ d = d || new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function dayNum(d){ d = d || new Date(); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function todayLog(){ const k = dayKey(); return store.days[k] || (store.days[k] = {q:0, ok:0, c:0}); }
function pruneDays(){ const old = dayKey(new Date(Date.now() - 120 * 86400000)); Object.keys(store.days).forEach(k => { if (k < old) delete store.days[k]; }); }
function markDone(task){ if (!task) return; const t = todayLog(); t.done = t.done || {}; t.done[task + ":" + LV.key] = 1; }
function isDone(task){ const t = store.days[dayKey()]; return !!(t && t.done && t.done[task + ":" + LV.key]); }
function streak(){
  const has = d => { const t = store.days[dayKey(d)]; return !!(t && t.q + t.c > 0); };
  const d = new Date(); let n = 0;
  if (!has(d)) d.setDate(d.getDate() - 1);
  while (has(d)){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------------- Spaced repetition (今日複習): words, grammar and the 生字本 ----------------
   store.srs[key] = {b: box 0–6, d: day due}. Remembered → next box, due again 1, 2, 4, 7, 15 or 30 days later;
   not yet → box 1, due tomorrow, and shown once more at the end of the session.
   Keys: v:<level>:<word>, g:<level>:<grammar point>, m:<dictionary key>. New cards per level and day: 10 words, 3 grammar points.
   生字本 words come up until they are first graded. 單字卡 only schedules the cards marked 還不熟 or already scheduled. */
const SRS_GAP = [0, 1, 2, 4, 7, 15, 30];
const NEW_PER_DAY = {v: 10, g: 3};
function srsGrade(key, knew){
  const s = store.srs[key] || {b: 0, d: 0}, t = dayNum();
  if (knew){ s.b = Math.min(s.b + 1, SRS_GAP.length - 1); s.d = t + SRS_GAP[s.b]; }
  else { s.b = 1; s.d = t + 1; }
  store.srs[key] = s;
}
const vocabCard = v => ({...v, kind: "v", sk: `v:${LV.key}:${v.k}`});
const grammarCard = g => ({...g, kind: "g", sk: `g:${LV.key}:${g.g}`});
function myCard(k){ const e = JEK[k]; return {k: e.h, r: e.r, pos: clsLabel(e), zh: e.zh, ex: store.mywords[k] || "", exzh: e.note, key: k, kind: "m", sk: `m:${k}`}; }
function reviewPlan(){
  const t = dayNum(), lg = store.days[dayKey()] || {}, isDue = c => !!store.srs[c.sk] && store.srs[c.sk].d <= t;
  const vs = VOCAB.map(vocabCard), gs = GRAMMAR.map(grammarCard);
  const mine = Object.keys(store.mywords).filter(k => JEK[k]).map(myCard).filter(c => !store.srs[c.sk] || isDue(c));
  const leftV = NEW_PER_DAY.v - ((lg.nv || {})[LV.key] || 0), leftG = NEW_PER_DAY.g - ((lg.ng || {})[LV.key] || 0);
  return {
    due: [...vs.filter(isDue), ...gs.filter(isDue), ...mine],
    fresh: [...vs.filter(c => !store.srs[c.sk] && !store.known[c.k]).slice(0, Math.max(0, leftV)), ...gs.filter(c => !store.srs[c.sk]).slice(0, Math.max(0, leftG))]
  };
}
function startReview(){
  const {due, fresh} = reviewPlan(), cards = [...shuffle(due), ...fresh];
  if (!cards.length) return goHome();
  deck = {review: true, cards, i: 0, flipped: false, knew: 0, miss: 0};
  renderCards(); window.scrollTo(0,0);
}

/* ---------------- Weak spots ---------------- */
function typeAcc(t){ let r = 0, w = 0; (BY_TYPE[t] || []).forEach(it => { const s = statOf(it.id); if (s){ r += s.r; w += s.w; } }); return {n: r + w, acc: r + w ? r / (r + w) : null}; }
const usable = t => tts.ok || !AUDIO_TYPES.has(t);
function weakTypes(){ return Object.keys(TYPES).filter(usable).map(t => ({t, ...typeAcc(t)})).filter(x => x.n >= 4 && x.acc < .8).sort((a, b) => a.acc - b.acc).slice(0, 3); }
function freshType(){ return Object.keys(TYPES).filter(usable).map(t => ({t, ...typeStats([t])})).filter(x => x.total).sort((a, b) => a.seen / a.total - b.seen / b.total)[0]; }

/* ---------------- 完整模考: the real test's sections, order and times ----------------
   One section at a time with its own countdown; time up hands the section in. Question counts per type: FULL_MOCK. */
function startFullMock(){
  stopSpeech(); stopClock();
  const sections = LV.exam.map(([name, min, secs], k) => ({name, min, audio: secs.includes("chokai"), steps: FULL_MOCK[LV.key][k]}));
  const items = [];
  sections.forEach(s => {
    if (s.audio && !tts.ok){ s.skipped = true; return; }
    s.from = items.length; items.push(...runSteps(s.steps)); s.to = items.length;
    if (s.to === s.from) s.skipped = true;
  });
  if (!items.length) return goHome();
  quiz = {mode: "full", exam: true, full: true, i: 0, answers: {}, start: Date.now(), sections, sec: -1, task: pendingTask,
          items: items.map(it => ({it, order: it.fixed ? it.fixed.slice() : shuffle(it.o.map((_,k) => k)), reveal: false}))};
  pendingTask = null;
  nextSection();
}
function nextSection(){
  stopClock(); stopSpeech();
  let k = quiz.sec + 1;
  while (k < quiz.sections.length && quiz.sections[k].skipped) k++;
  if (k >= quiz.sections.length){ quiz.end = Date.now(); renderResult(true); return; }
  quiz.sec = k; renderFullBreak(); window.scrollTo(0,0);
}
function beginSection(){
  const s = quiz.sections[quiz.sec];
  s.start = Date.now(); quiz.i = s.from;
  startClock(); renderQuiz(true); window.scrollTo(0,0);
}
function endSection(timeUp){
  const s = quiz.sections[quiz.sec];
  if (!s || !s.start || s.end) return;
  s.end = Date.now(); s.timeUp = !!timeUp;
  nextSection();
}
function renderFullBreak(){
  view = "fullbreak"; $app.dataset.view = view; resetLook();
  const ss = quiz.sections, now = ss[quiz.sec], prev = ss.slice(0, quiz.sec).reverse().find(s => s.end);
  const rows = ss.map((s, k) => {
    const n = s.skipped ? 0 : s.to - s.from, ans = s.skipped ? 0 : quiz.items.slice(s.from, s.to).filter(x => quiz.answers[x.it.id]).length;
    const st = s.skipped ? tx("略過：這台裝置沒有日文語音", "スキップ：日本語音声なし")
      : s.end ? tx(`完成・作答 ${ans}/${n}${s.timeUp ? "・時間到" : ""}`, `終了・解答 ${ans}/${n}${s.timeUp ? "・時間切れ" : ""}`)
      : k === quiz.sec ? tx("下一節", "次の科目") : tx("還沒開始", "これから");
    return `<li class="${k === quiz.sec ? "cur" : ""}"><b lang="ja">${s.name}</b><span>${s.min} ${tx("分鐘", "分")}${s.skipped ? "" : tx(`・${n} 題`, `・${n} 問`)}</span><em>${st}</em></li>`;
  }).join("");
  const msg = prev ? tx(`「${prev.name}」結束${prev.timeUp ? "（時間到，自動交卷）" : ""}。可以先休息一下，準備好再開始下一節。`, `「${prev.name}」終了${prev.timeUp ? "（時間切れで自動提出）" : ""}。少し休んで、準備ができたら次の科目へ。`)
    : tx("照正式考試的節次和時間，每一節倒數計時，時間到會自動交卷。交卷前可以改答案，也可以點上面的題號跳題；解析和查字要全部考完才看得到。聽解會自動播放（正式考試只播一次，這裡可以重播）。",
         "本番と同じ科目順・時間で、科目ごとにカウントダウンします。時間になると自動で提出されます。提出前なら答えを変えられ、上の番号で移動できます。解説と辞書はすべて終わってから使えます。聴解は自動で再生されます（本番は一回だけですが、ここでは再生し直せます）。");
  $app.innerHTML = `${prefsHTML()}
    <div class="qtop">${back()}<div class="qtitle">${tx("完整模考", "本番形式の模試")}</div></div>
    <section class="sheet fullbreak">
      <p class="fb-msg">${msg}</p>
      <ol class="secs">${rows}</ol>
      <div class="row"><button class="btn" data-act="fullgo">${tx(`開始這一節（${now.min} 分鐘）`, `この科目を始める（${now.min} 分）`)}</button></div>
    </section>`;
}

/* ---------------- Full-sentence answers for explanations ---------------- */
function fullHTML(it){
  const c = it.o[0];
  const fill = x => `<span class="fill">${jpHTML(x)}</span>`;
  switch (it.type){
    case "kanji": return jpHTML(it.p.replace(/\[([^\]]+)\]/, (m,w) => `{${w}:${c}}`));
    case "hyoki": return jpHTML(it.p.replace(/\[([^\]]+)\]/, (m,w) => `{${c}:${w}}`));
    case "bunmyaku": case "bunpo": case "gokei": return jpHTML(it.p).replace('<span class="blank">（　　）</span>', fill(c));
    case "narabe": { let k = 0; return jpHTML(it.p.replace(/＿★＿|＿＿＿/g, () => `\u0001${k++}\u0001`)).replace(/\u0001(\d)\u0001/g, (m,n) => fill(it.o[+n])); }
    case "iikae": return `${jpHTML(it.p)}<br>＝ ${fill(c)}`;
    case "yoho": return fill(c);
    case "bunsho": return `<span class="pb">${it.qi}</span> ${fill(c)}`;
    default: return "";
  }
}
function explainHTML(q, a){
  const it = q.it, ok = a.ok, right = q.order.indexOf(ansOf(it));
  let h = `<div class="explain"><div class="verdict ${ok ? "ok" : "ng"}">${ok ? tx("答對了", "正解") : tx("答錯了", "不正解")} <span class="ans">${tx("正確答案", "正解は")} ${NUMS[right]}</span></div>`;
  const full = fullHTML(it);
  if (full) h += `<p class="full" lang="ja">${full}</p>`;
  if (AUDIO_TYPES.has(it.type)) h += transcriptHTML(q);
  if (it.zh) h += `<p class="zh"${ZH}>${esc(it.zh)}</p>`;
  if (it.note) h += `<p class="tip"${ZH}>${noteHTML(it.note)}</p>`;
  return h + `</div>`;
}
/* Notes are Chinese with Japanese inside 「」; mark the quoted bits as ja */
function noteHTML(s){ return esc(s).replace(RUBY_RE, (m,b,r) => `<ruby>${b}<rt>${r}</rt></ruby>`).replace(/「([^」]+)」/g, '<span lang="ja">「$1」</span>'); }
/* The script of a listening item; each line has a button that reads just that line again */
function transcriptHTML(q){
  const it = q.it;
  const sp = r => ({m:tx("男", "男"), f:tx("女", "女"), m2:tx("男2", "男2"), f2:tx("女2", "女2"), n:tx("旁白", "ナレーター")}[r] || "");
  const line = (role, xs, label) => {
    xs = [].concat(xs);
    const say = tts.ok ? `<button type="button" class="lp" data-act="line" data-r="${role}" data-t="${esc(xs.map(plain).join(""))}" aria-label="${tx("念這一句", "この文を再生")}">${ICON_PLAY}</button>` : "";
    return `<p>${say}<span class="sp">${label == null ? sp(role) : label}</span>${xs.map(x => jp(x)).join("")}</p>`;
  };
  /* the options are said by the same voices as in audioParts() */
  const optRole = it.type === "hatsuwa" ? (it.who || "f") : it.type === "sokuji" ? (it.line[0] === "m" ? "f" : "m") : "n";
  const opts = () => q.order.map((k,i) => line(optRole, it.o[k], NUMS[i])).join("");
  let t = "";
  if (it.type === "kadai" || it.type === "point"){
    t += line("n", [it.intro, it.q]);
    it.lines.forEach(([r,x]) => t += line(r, x));
  } else if (spokenQ(it)){
    t += line("n", it.intro);
    it.lines.forEach(([r,x]) => t += line(r, x));
    t += line("n", it.q) + opts();
  } else if (it.type === "togoc"){
    t += line("n", it.intro);
    it.lines.forEach(([r,x]) => t += line(r, x));
    t += line("n", qLabel(it) + it.q);
  } else if (it.type === "hatsuwa"){
    t += line("n", it.ja) + opts();
  } else {
    t += line(it.line[0], it.line[1]) + opts();
  }
  return `<div class="transcript">${t}</div>`;
}
/* ---------------- Render: quiz ---------------- */
const PLABEL = {"留言":"メモ","公告":"お知らせ","電子郵件":"メール","短文":"短文","課程表":"クラス案内","說明":"案内","廣告":"広告","比較閱讀":"読み比べ","評論":"評論","隨筆":"エッセイ","說明文":"説明文","小說":"小説","文章":"文章"};
function passageHTML(it){
  const p = it.passage;
  /* Paragraph strings: a leading "!" means no first-line indent (memos, notices). Objects {table:[[header...],[row...]]} become tables. */
  const para = x => {
    if (typeof x === "string" && x.startsWith("§")) return `<p class="plabel" lang="ja">${esc(x.slice(1))}</p>`;
    if (typeof x !== "string") return `<table>${x.table.map((r,i) => `<tr>${r.map(c => i === 0 ? `<th>${jpHTML(c)}</th>` : `<td>${jpHTML(c)}</td>`).join("")}</tr>`).join("")}</table>`;
    const ni = x.startsWith("!");
    return `<p${ni ? ' class="ni"' : ""}>${jpHTML(ni ? x.slice(1) : x, it.type === "bunsho" ? it.qi : null)}</p>`;
  };
  const body = p.body.map(para).join("");
  const label = it.type === "bunsho" ? tx(`文章（空格 ${it.qi}）`, `文章（空欄 ${it.qi}）`) : (p.title_zh ? tx(p.title_zh, PLABEL[p.title_zh] || p.title_zh) : tx("文章", "文章"));
  return `<details class="passage" open><summary>${esc(label)}</summary><div class="ptext fz" lang="ja">${p.title ? `<h4>${jpHTML(p.title)}</h4>` : ""}${body}</div>${p.zh && quiz.answers[it.id] ? `<p class="note"${ZH} style="padding:0 14px">${esc(p.zh)}</p>` : ""}</details>`;
}
function audioHTML(q, a){
  const it = q.it;
  let h = `<div class="audio">`;
  if (tts.ok) h += `<button class="play" id="playbtn" data-act="play">${ICON_PLAY}${tx(" 播放題目", " 音声を再生")}</button><button class="btn-ghost" data-act="slow" aria-pressed="${store.slow ? "true" : "false"}">${tx("慢速", "ゆっくり")}</button>`;
  if (!a && !q.reveal) h += `<button class="btn-ghost" data-act="reveal">${tx("顯示原文", "スクリプトを表示")}</button>`;
  h += `</div><p class="note" id="anote">${audioNote()}</p>`;
  if (it.type === "hatsuwa") h += `<p class="situ"><span${ZH}>${esc(it.sit)}</span><span class="ja" lang="ja">${jpHTML(it.ja)}</span></p>`;
  if (it.type === "kadai" || it.type === "point") h += `<p class="prompt small fz" lang="ja">${jpHTML(it.q)}</p>`;
  if (it.type === "togoc" && it.printed && it.gn > 1) h += `<p class="prompt small" lang="ja">質問${it.gi}<span class="qsub"${ZH}>${tx("（問題用聽的，畫面只印選項）", "（質問は音声だけです）")}</span></p>`;
  if (q.reveal && (!a || quiz.exam)) h += transcriptHTML(q);
  return h;
}
function audioNote(){
  if (!tts.ok) return tx("這個瀏覽器不支援語音朗讀，請按「顯示原文」用看的練習。", "このブラウザは音声の読み上げに対応していません。「スクリプトを表示」で読んで練習してください。");
  if (!hasJa()) return tx("找不到日文語音（可能還在載入）。若一直沒聲音，請到系統設定加裝日文語音，或按「顯示原文」。", "日本語の音声が見つかりません（読み込み中かもしれません）。音が出ない場合は端末に日本語音声を追加するか、「スクリプトを表示」を使ってください。");

/* Rough score for each 得点区分: the share answered right times that section's full marks.
   The real test uses scaled scores (equating), so this is only a guide. Rows follow LV.pass.rows, groups follow LV.score. */
function estimateScore(list){
  const groups = [...new Set(Object.values(LV.score))], got = {};
  list.forEach(x => { const g = LV.score[TYPES[x.it.type].sec], c = got[g] = got[g] || [0, 0]; c[1]++; if (quiz.answers[x.it.id] && quiz.answers[x.it.id].ok) c[0]++; });
  const rows = LV.pass.rows.map((r, i) => { const c = got[groups[i]]; return {zh: r[0], ja: r[1], min: r[2], max: r[3], ok: c ? c[0] : 0, n: c ? c[1] : 0, pts: c ? Math.round(c[0] / c[1] * r[3]) : null}; });
  const complete = rows.every(r => r.pts != null), total = rows.reduce((s, r) => s + (r.pts || 0), 0);
  const low = rows.filter(r => r.pts != null && r.pts < r.min);
  return {rows, complete, total, low, pass: low.length ? false : complete ? total >= LV.pass.total : null};
}

const VCAT_JA = {"全部":"すべて","還不熟":"まだ","動詞":"動詞","い形容詞":"い形容詞","な形容詞":"な形容詞","名詞":"名詞","副詞・其他":"副詞・その他","外來語":"外来語"};
const POS_JA = {"外來語":"外来語","接續詞":"接続詞"};
function vocabIn(cat){
  if (cat === "全部") return VOCAB;
  if (cat === "還不熟") return VOCAB.filter(v => !store.known[v.k]);
  return VOCAB.filter(v => v.cat === cat);
}
function startCards(cat){ deck = {cat, cards: shuffle(vocabIn(cat)).map(vocabCard), i: 0, flipped: false, knew: 0, miss: 0}; renderCards(); }
/* One card view for three decks: 單字卡 (by category), 生字本, and 今日複習 (words, grammar and 生字本 words due today) */
function renderCards(){
  view = "cards"; $app.dataset.view = view; resetLook();
  const plainDeck = !deck.mine && !deck.review;
  const chips = plainDeck ? VCATS.map(c => `<button class="chip" data-act="vcat" data-c="${c}" aria-pressed="${deck.cat === c}">${esc(tx(c, VCAT_JA[c]))}<small>${vocabIn(c).length}</small></button>`).join("") : "";
  const title = deck.review ? tx("今日複習", "今日の復習") : deck.mine ? tx("生字本", "単語帳") : tx("單字卡", "単語カード");
  const top = `${prefsHTML()}<div class="qtop">${back()}<div class="qtitle">${title}</div><div class="qcount">${Math.min(deck.i+1, deck.cards.length)}/${deck.cards.length}</div></div>${chips ? `<div class="chips">${chips}</div>` : ""}`;
  if (deck.review && deck.i >= deck.cards.length){
    markDone("review"); pruneDays(); save();
    const p = reviewPlan(), left = p.due.length + p.fresh.length;
    $app.innerHTML = `${top}<section class="sheet done-card"><p><b>${tx("今日複習完成", "今日の復習は完了です")}</b></p><p class="hint">${tx(`記住 ${deck.knew} 張・還不熟 ${deck.miss} 張（還不熟的明天會再出現）`, `覚えた ${deck.knew} 枚・まだ ${deck.miss} 枚（まだのカードは明日また出ます）`)}</p><div class="row">${left ? `<button class="btn" data-act="review">${tx(`繼續複習（還有 ${left} 張）`, `続ける（あと ${left} 枚）`)}</button>` : ""}<button class="btn${left ? " alt" : ""}" data-act="home">${tx("回首頁", "ホームへ")}</button></div></section>`;
    return;
  }
  if (deck.mine && deck.i >= deck.cards.length){
    const left = myCards().length;
    $app.innerHTML = `${top}<section class="sheet done-card"><p><b>${tx("生字本這一輪複習完了", "単語帳はひと通り終わりました")}</b></p><p class="hint">${tx(`記住 ${deck.knew} 個（已移出生字本），還剩 ${left} 個`, `覚えた ${deck.knew} 語（単語帳から外しました）・残り ${left} 語`)}</p><div class="row">${left ? `<button class="btn" data-act="mywords">${tx("再複習一次", "もう一度")}</button>` : ""}<button class="btn alt" data-act="home">${tx("回首頁", "ホームへ")}</button></div></section>`;
    return;
  }
  if (!deck.cards.length || deck.i >= deck.cards.length){
    const total = VOCAB.filter(v => store.known[v.k]).length;
    $app.innerHTML = `${top}<section class="sheet done-card"><p><b>${deck.cards.length ? tx("這一疊翻完了", "このセットは終わりです") : tx("這一類沒有卡片", "カードがありません")}</b></p><p class="hint">${tx(`這輪記住 ${deck.knew} 個・總共記住 ${total}/${VOCAB.length}`, `今回覚えた ${deck.knew} 語・合計 ${total}/${VOCAB.length} 語`)}</p><div class="row"><button class="btn" data-act="vcat" data-c="還不熟">${tx("只翻還不熟的", "まだのカードだけ")}</button><button class="btn alt" data-act="vcat" data-c="${deck.cat}">${tx("這疊再一輪", "もう一周")}</button></div></section>`;
    return;
  }
  const v = deck.cards[deck.i], isG = v.kind === "g";
  const pct = Math.round(deck.i / deck.cards.length * 100);
  const tag = deck.review ? `<span class="ftag">${v.rq ? tx("再一次", "もう一度") : store.srs[v.sk] ? tx("複習", "復習") : tx("新卡", "新規")}</span>` : "";
  const front = isG ? `<div class="fpos">${tx("文法", "文法")}・${gcat(v.cat)}</div><div class="fword gword" lang="ja">${esc(v.g)}</div>`
    : `<div class="fpos" lang="ja">${v.kind === "m" ? esc(v.pos) : esc(lang === "ja" ? (POS_JA[v.pos] || v.pos) : v.pos)}${v.kind === "v" && store.known[v.k] ? tx("・已記住", "・覚えた") : ""}</div><div class="fword" lang="ja">${esc(v.k)}</div>`;
  const backFace = !deck.flipped ? `<div class="hint">${isG ? tx("先想意思和接續，點卡片翻面", "意味と接続を考えてから、タップでめくる") : tx("先想讀音和意思，點卡片翻面", "読みと意味を考えてから、タップでめくる")}</div>`
    : isG ? `<div class="fzh"${ZH}>${esc(v.zh)}</div><div class="fconn"><span>${tx("接續", "接続")}</span><span lang="ja">${esc(v.conn)}</span></div><div class="fex"><span lang="ja">${jpHTML(v.ex)}</span><small${ZH}>${esc(v.exzh)}</small></div>${v.tip ? `<div class="ftip"${ZH}>${noteHTML(v.tip)}</div>` : ""}`
    : `${v.r !== v.k ? `<div class="fread" lang="ja">${esc(v.r)}</div>` : ""}<div class="fzh"${ZH}>${esc(v.zh)}</div>${v.ex ? `<div class="fex"><span lang="ja">${jpHTML(v.ex)}</span>${v.exzh ? `<small${ZH}>${v.kind === "m" ? noteHTML(v.exzh) : esc(v.exzh)}</small>` : ""}</div>` : ""}`;
  $app.innerHTML = `${top}<div class="bar"><i style="width:${pct}%"></i></div>
    <section class="sheet fcard" data-act="flip" role="button" tabindex="0" aria-label="${tx("翻面", "めくる")}">
      ${tag}${tts.ok ? `<button class="say" data-act="sayv" aria-label="${tx("念出來", "読み上げ")}">${ICON_SPEAK}</button>` : ""}
      ${front}${backFace}
    </section>
    <div class="cbtns"><button class="btn alt" data-act="unknown">${tx("還不熟", "まだ")}</button><button class="btn" data-act="known">${tx("記住了", "覚えた")}</button></div>
    <p class="kbd" style="text-align:center"><kbd>${tx("空白鍵", "スペース")}</kbd> ${tx("翻面", "めくる")}　<kbd>←</kbd> ${tx("還不熟", "まだ")}　<kbd>→</kbd> ${tx("記住了", "覚えた")}</p>`;
}
function cardAnswer(knew){
  const v = deck.cards[deck.i]; if (!v) return;
  const lg = todayLog(); lg.c++;
  if (deck.mine && knew){ delete store.mywords[v.key]; delete store.srs[v.sk]; deck.knew++; }
  else {
    if (!v.rq){
      if (deck.review){
        /* a word or grammar card seen for the first time uses up one of today's new cards for this level */
        if (!store.srs[v.sk] && v.kind !== "m"){ const f = v.kind === "g" ? "ng" : "nv"; lg[f] = lg[f] || {}; lg[f][LV.key] = (lg[f][LV.key] || 0) + 1; }
        srsGrade(v.sk, knew);
      } else if (store.srs[v.sk] || !knew) srsGrade(v.sk, knew);
      if (knew) deck.knew++; else deck.miss++;
    }
    if (v.kind === "v"){ if (knew) store.known[v.k] = 1; else delete store.known[v.k]; }
    if (!knew && deck.review && !v.rq) deck.cards.push({...v, rq: true});
  }
  save(); deck.i++; deck.flipped = false; renderCards();
}
/* ---------------- Render: grammar reference ---------------- */
const gcats = () => ["全部", ...new Set(GRAMMAR.map(g => g.cat))];
const GCAT_JA = {"全部":"すべて","授受":"授受表現","被動・使役":"受身・使役","推測・樣態":"推量・様態","條件":"条件","逆接・讓步":"逆接・譲歩","時間・狀態":"時間・状態","目的・原因":"目的・原因","變化・決定":"変化・決定","許可・義務":"許可・義務","比較・程度":"比較・程度","敬語":"敬語","助詞":"助詞","句型":"文型","強調・限定":"強調・限定","評價・感情":"評価・感情","話題・關聯":"話題・関連","範圍・對象":"範囲・対象","書面語":"書き言葉","其他":"その他"};
const gcat = c => esc(tx(c, GCAT_JA[c] || c));
function renderGrammar(keepFocus){
  view = "grammar"; $app.dataset.view = view; resetLook();
  const q = gram.q.trim().toLowerCase();
  const list = GRAMMAR.filter(g => (gram.cat === "全部" || g.cat === gram.cat) && (!q || [g.g, g.zh, g.conn, plain(g.ex), kana(g.ex), g.exzh, g.tip].join(" ").toLowerCase().includes(q)));
  const empty = `<p class="empty">${tx("找不到符合的文法", "該当する文法がありません")}</p>`;
  const items = list.map(g => `<details><summary><b lang="ja">${esc(g.g)}</b><span${ZH}>${esc(g.zh)}</span><i>${gcat(g.cat)}</i></summary><div class="gx">
      <div class="row"><span>${tx("接續", "接続")}</span><span lang="ja">${esc(g.conn)}</span></div>
      <div class="row"><span>${tx("例句", "例文")}</span><span class="ex"><span lang="ja">${jpHTML(g.ex)}</span>${tts.ok ? `<button class="say-sm" data-act="sayg" data-t="${esc(g.ex)}" aria-label="${tx("念例句", "例文を読み上げ")}">${ICON_SPEAK}</button>` : ""}<small${ZH}>${esc(g.exzh)}</small></span></div>
      ${g.tip ? `<div class="warn"${ZH}>${noteHTML(g.tip)}</div>` : ""}</div></details>`).join("");
  if (keepFocus){
    const box = $app.querySelector(".glist"), cnt = $app.querySelector(".qcount");
    if (box){ box.innerHTML = items || empty; cnt.textContent = `${list.length}/${GRAMMAR.length}`; return; }
  }
  $app.innerHTML = `${prefsHTML()}
    <div class="qtop">${back()}<div class="qtitle">${tx("文法速查", "文法一覧")}</div><div class="qcount">${list.length}/${GRAMMAR.length}</div></div>
    <input class="search" type="search" id="gsearch" placeholder="${tx("搜尋文法、中文意思或例句", "文法・意味・例文で検索")}" value="${esc(gram.q)}" autocomplete="off">
    <div class="chips">${gcats().map(c => `<button class="chip" data-act="gcat" data-c="${c}" aria-pressed="${gram.cat === c}">${gcat(c)}</button>`).join("")}</div>
    <section class="sheet glist">${items || empty}</section>`;
}
