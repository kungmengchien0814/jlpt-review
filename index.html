/* ---------------- Events ---------------- */
function startType(t){ startQuiz("type:" + t, itemsForType(t)); }
function startSecMix(s){
  const items = LV.mix[s] ? runSteps(LV.mix[s]) : pickItems(SEC_TYPES[s].filter(t => !PASSAGE_TYPES.has(t)).flatMap(t => BY_TYPE[t]), 10);
  startQuiz("sec:" + s, items);
}
/* Switching level: N4 is built in; other levels are fetched the first time */
function switchLevel(k){
  if (!LEVEL_CONF[k]) return;
  stopClock(); stopSpeech(); quiz = null; deck = null;
  if (LEVELS[k]) return enterLevel(k);
  wantLevel = k; loadFailed = false; renderLoading(k);
  loadLevel(k).then(() => { if (wantLevel === k) enterLevel(k); }, () => { if (wantLevel === k){ loadFailed = true; renderLoading(k); } });
}
function enterLevel(k){
  wantLevel = null; loadFailed = false;
  store.level = k; save(); useLevel(k); applyLang();
  gram = {q:"", cat:"全部"}; curSec = "goi";
  renderHome(); window.scrollTo(0,0);
}
function renderLoading(k){
  view = "loading"; $app.dataset.view = view; resetLook();
  const C = LEVEL_CONF[k];
  $app.innerHTML = `${prefsHTML()}<section class="sheet done-card" aria-live="polite"><p><b>${loadFailed ? tx(`${C.label} 題庫載入失敗`, `${C.label} の問題を読み込めませんでした`) : tx(`正在載入 ${C.label} 題庫…`, `${C.label} の問題を読み込み中…`)}</b></p>${loadFailed ? `<p class="hint">${tx("請確認網路連線，再試一次。", "ネットワークを確認して、もう一度お試しください。")}</p><div class="row"><button class="btn" data-act="level" data-v="${k}">${tx("再試一次", "もう一度")}</button><button class="btn alt" data-act="level" data-v="${LV.key}">${tx(`回到 ${LV.label}`, `${LV.label} に戻る`)}</button></div>` : ""}</section>`;
}
function again(){
  const m = quiz.mode;
  if (m === "mock") return startQuiz("mock", buildMock(), true);
  if (m === "full") return startFullMock();
  if (m.startsWith("type:")) return startType(m.slice(5));
  if (m.startsWith("sec:")) return startSecMix(m.slice(4));
  if (m === "wrong" || m === "retry") return startWrong();
  goHome();
}
function startWrong(){ const ids = shuffle(store.wrong.filter(id => ITEMS[id])).slice(0, 15); if (!ids.length) return goHome(); startQuiz("wrong", ids.map(id => ITEMS[id])); }
/* Redraw the current screen after a language switch; answers, timers and card position are kept */
function rerender(){
  if ((view === "quiz" || view === "quiz-p") && quiz) renderQuiz(false);
  else if (view === "fullbreak" && quiz) renderFullBreak();
  else if (view === "result" && quiz) renderResult(false);
  else if (view === "cards" && deck) renderCards();
  else if (view === "grammar") renderGrammar();
  else if (view === "info") renderInfo();
  else if (view === "sec") renderSec(curSec);
  else if (view === "loading" && wantLevel) renderLoading(wantLevel);
  else renderHome();
}
const leaveExam = () => !inExam() || confirm(tx("現在離開，這次模考就不會記錄。確定要離開嗎？", "今やめると、この模試は記録されません。やめますか？"));
$app.addEventListener("click", e => {
  const wEl = e.target.closest(".w");
  if (wEl){
    const block = lookBlock(wEl);
    if (block !== "pick"){ e.preventDefault(); e.stopPropagation(); if (wcur && wcur.el === wEl) closeWord(); else openWord(wEl, block); return; }
  }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  /* a button in 今日任務 carries the task it completes */
  pendingTask = el.dataset.task || null;
  switch (act){
    case "home": if (!leaveExam()) return; return goHome();
    case "lang":
      if (lang !== el.dataset.v){ lang = store.lang = el.dataset.v; save(); applyLang(); rerender(); }
      return;
    case "lvmenu": return levelMenu();
    case "level":
      levelMenu(false);
      if ((el.dataset.v !== LV.key || view === "loading") && leaveExam()) switchLevel(el.dataset.v);
      return;
    case "theme":
      store.theme = el.dataset.v; save(); applyTheme();
      document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === currentTheme()));
      return;
    case "mock": return startQuiz("mock", buildMock(), true);
    case "fullmock": return startFullMock();
    case "fullgo": return beginSection();
    case "jump": stopSpeech(); quiz.i = +el.dataset.i; renderQuiz(true); return window.scrollTo(0,0);
    case "review": return startReview();
    case "sec": renderSec(el.dataset.s); return window.scrollTo(0,0);
    case "type": return startType(el.dataset.t);
    case "secmix": return startSecMix(el.dataset.s);
    case "pick": return select(+el.dataset.i);
    case "skip": quiz.answers[cur().it.id] = undefined; return next();
    case "next": return next();
    case "play": { const q = cur(); return speakSeq(audioParts(q.it, q.order)); }
    case "line": return speakSeq([{text: el.dataset.t, role: el.dataset.r || "n", gap: 0}]);
    case "reveal": cur().reveal = true; return renderQuiz(false);
    case "guide": quiz.guide = !quiz.guide; return renderQuiz(false);
    case "slow": store.slow = !store.slow; save(); el.setAttribute("aria-pressed", store.slow ? "true" : "false"); { const q = cur(); return speakSeq(audioParts(q.it, q.order)); }
    case "furi": store.furi = !store.furi; save(); applyFuri(); el.setAttribute("aria-pressed", store.furi ? "true" : "false"); return;
    case "retry": { const ids = quiz.items.filter(x => !(quiz.answers[x.it.id] && quiz.answers[x.it.id].ok)).map(x => x.it); return startQuiz("retry", ids); }
    case "again": return again();
    case "wrong": return startWrong();
    case "cards": return startCards("全部");
    case "mywords": return startMyWords();
    case "vcat": return startCards(el.dataset.c);
    case "flip": if (e.target.closest(".say")) return; deck.flipped = !deck.flipped; return renderCards();
    case "sayv": e.stopPropagation(); { const v = deck.cards[deck.i]; if (v) sayText(v.kind === "g" ? v.ex : v.r); } return;
    case "known": return cardAnswer(true);
    case "unknown": return cardAnswer(false);
    case "goal": store.goal = +el.dataset.n; save(); return renderHome();
    case "install": return installApp();
    case "grammar": gram = {q:"", cat:"全部"}; renderGrammar(); return window.scrollTo(0,0);
    case "gcat": gram.cat = el.dataset.c; return renderGrammar();
    case "sayg": e.preventDefault(); return sayText(el.dataset.t);
    case "info": return renderInfo();
    case "reset":
      if (confirm(tx("確定清除所有練習紀錄、錯題本、單字卡和複習進度、模考紀錄？（生字本會留著）", "すべての記録、間違えた問題、単語カードと復習の進み具合、模試の記録を消しますか？（単語帳は残ります）"))){
        const keep = {furi: store.furi, checks: store.checks, lang: store.lang, theme: store.theme, mywords: store.mywords, slow: store.slow, level: store.level, goal: store.goal};
        Object.keys(store).forEach(k => delete store[k]);
        Object.assign(store, {stats:{}, wrong:[], answered:0, correct:0, known:{}, best:null, days:{}, srs:{}, mocks:{}}, keep); save(); renderHome();
      }
      return;
  }
});
$app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "check"){ store.checks[el.dataset.k] = el.checked; save(); }
  if (el.dataset.act === "furi-sw"){ store.furi = el.checked; save(); applyFuri(); }
});
$app.addEventListener("input", e => { if (e.target.id === "gsearch"){ gram.q = e.target.value; renderGrammar(true); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && wcur){ closeWord(); return; }
  if (levelMenuOpen()){
    const bs = [...document.querySelectorAll("#lvmenu button")], i = bs.indexOf(document.activeElement);
    if (e.key === "Escape"){ e.preventDefault(); levelMenu(false); const b = document.querySelector(".lvl-btn"); if (b) b.focus(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); bs[(i + (e.key === "ArrowDown" ? 1 : bs.length - 1)) % bs.length].focus(); return; }
    if (e.key === "Home" || e.key === "End"){ e.preventDefault(); bs[e.key === "Home" ? 0 : bs.length - 1].focus(); return; }
    if (e.key === "Tab") levelMenu(false);
    return;
  }
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && e.target.classList && e.target.classList.contains("lvl-btn")){ e.preventDefault(); return levelMenu(true); }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if ((view === "quiz" || view === "quiz-p") && quiz){
    const q = cur(), a = quiz.answers[q.it.id];
    const n = q.it.o.length;
    if ((!a || quiz.exam) && /^[1-4]$/.test(e.key) && +e.key <= n){ e.preventDefault(); return select(+e.key - 1); }
    if (a && e.key === "Enter" && e.target.tagName !== "BUTTON"){ e.preventDefault(); return next(); }
    if (e.key === " " && AUDIO_TYPES.has(q.it.type) && tts.ok && e.target.tagName !== "BUTTON"){ e.preventDefault(); return speakSeq(audioParts(q.it, q.order)); }
  }
  if (view === "cards" && deck && deck.i < deck.cards.length){
    if (e.key === " " && e.target.tagName !== "BUTTON"){ e.preventDefault(); deck.flipped = !deck.flipped; return renderCards(); }
    if (e.key === "ArrowRight"){ e.preventDefault(); return cardAnswer(true); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); return cardAnswer(false); }
  }
  if (view === "cards" && e.key === "Enter" && e.target.classList && e.target.classList.contains("fcard")){ deck.flipped = !deck.flipped; renderCards(); }
});

/* ---------------- Install and offline use ----------------
   sw.js keeps a copy of the page and of each level file once loaded; it always tries the network first. */
let installEvt = null;
function refreshInstall(){ const box = document.getElementById("install"); if (box) box.outerHTML = installHTML(); }
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; refreshInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; refreshInstall(); });
function installApp(){
  if (!installEvt) return;
  const ev = installEvt; installEvt = null;
  ev.prompt();
  Promise.resolve(ev.userChoice).catch(() => {}).then(refreshInstall);
}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

if (START_LEVEL === "n4") renderHome(); else switchLevel(START_LEVEL);
</script>
