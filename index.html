<style>
:root{
  /* Direction: a JLPT mark sheet. Indigo drop-out print on warm paper, graphite pencil fills, numbered bubbles 1–4. */
  --paper:#f3f2ee;
  --sheet:#ffffff;
  --ink:#1e2126;
  --muted:#5d636b;
  --print:#3b55a0;
  --print-soft:#e5e9f5;
  --line:#cdd5e8;
  --lead:#26282c;
  --lead-ink:#ffffff;
  --good:#1d6e44;
  --good-soft:#e1f1e7;
  --bad:#b02a20;
  --bad-soft:#fbe6e3;
  --f-form:"Barlow Condensed","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-jp:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN","MS PMincho",serif;
  --f-kyo:"Klee One","Noto Serif JP","Yu Mincho",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121418;--sheet:#1a1d22;--ink:#e9e8e3;--muted:#a2a8b0;
    --print:#93aef0;--print-soft:#1f2740;--line:#323c55;
    --lead:#e9e8e3;--lead-ink:#121418;
    --good:#72d09b;--good-soft:#17342a;--bad:#ff9086;--bad-soft:#3d1d1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121418;--sheet:#1a1d22;--ink:#e9e8e3;--muted:#a2a8b0;
  --print:#93aef0;--print-soft:#1f2740;--line:#323c55;
  --lead:#e9e8e3;--lead-ink:#121418;
  --good:#72d09b;--good-soft:#17342a;--bad:#ff9086;--bad-soft:#3d1d1a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--f-ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--print);outline-offset:2px}
/* Japanese interface: Japanese gothic for the UI, Mincho for Japanese study text, Chinese content keeps Chinese fonts */
html[lang="ja"] body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif}
html[lang="ja"] [lang="zh-Hant"]{font-family:var(--f-ui)}
body [lang="ja"]{font-family:var(--f-jp)}
.prefs{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--sheet)}
.seg button{border:0;background:none;border-radius:999px;min-height:30px;padding:4px 12px;font:600 13px/1.2 var(--f-ui);color:var(--muted);cursor:pointer}
.seg button[lang="ja"]{font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",var(--f-ui)}
.seg button[aria-pressed="true"]{background:var(--lead);color:var(--lead-ink)}
.seg button[aria-pressed="false"]:hover{color:var(--ink)}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
.foot{max-width:680px;margin:0 auto;padding:8px 16px 48px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}
.foot p{margin:0}
.home-main,.home-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.kbd{display:none;margin:0;font-size:13px;color:var(--muted)}
.kbd kbd{font:600 12px/1 var(--f-num);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 6px;margin:0 2px;background:var(--sheet);color:var(--ink)}
.qnav + .kbd{text-align:right;margin-top:-6px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sec-head{font-family:var(--f-form);font-weight:600;letter-spacing:.08em;font-size:15px;color:var(--print);padding:10px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-head small{font-family:var(--f-ui);font-weight:400;letter-spacing:0;color:var(--muted);font-size:13px}
.pad{padding:14px 16px}
.pad p{margin:0 0 10px}
.pad p:last-child{margin-bottom:0}
a{color:var(--print)}

/* Ruby: furigana can be switched on and off for questions; explanations always show it */
ruby{ruby-position:over}
rt{font-size:.5em;font-family:var(--f-jp);letter-spacing:0;color:var(--muted)}
html:not(.furi) .fz rt{display:none}
.tg{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px}
.blank{display:inline-block;min-width:4.5em;text-align:center;letter-spacing:.1em}
.fill{color:var(--good);font-weight:600;border-bottom:2px solid var(--good)}
.slot{display:inline-block;width:3.2em;border-bottom:2px solid var(--muted);margin:0 3px;vertical-align:baseline;text-align:center;line-height:1.2;color:var(--print);font-family:var(--f-num);font-size:.85em}
.slot.star{border-color:var(--print)}

/* Masthead */
.mast-band{display:flex;justify-content:space-between;gap:12px;background:var(--print);color:var(--sheet);font-family:var(--f-form);font-weight:600;letter-spacing:.1em;font-size:14px;padding:6px 16px}
.mast-body{padding:18px 16px 16px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.deco{display:flex;gap:6px;margin-bottom:12px}
.deco i{width:24px;height:24px;border:1.5px solid var(--print);border-radius:50%;display:grid;place-items:center;font:600 11px/1 var(--f-num);font-style:normal;color:var(--print)}
.deco i.on{animation:pencil .5s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes pencil{from{background:transparent;color:var(--print);border-color:var(--print);transform:scale(.8)}60%{transform:scale(1.12)}to{background:var(--lead);color:var(--lead-ink);border-color:var(--lead);transform:scale(1)}}
.mast h1{margin:0;font-size:clamp(28px,7.5vw,38px);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
.mast p{margin:6px 0 0;color:var(--muted);font-size:15px}
.count{text-align:right;line-height:1.1}
.count small{display:block;font-size:12px;color:var(--print);letter-spacing:.04em}
.count b{font:600 44px/1 var(--f-num);font-variant-numeric:tabular-nums}
.count span{font-family:var(--f-jp);font-size:16px;margin-left:4px}
.count.today b{font-size:26px;font-family:var(--f-ui)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stat{padding:10px 16px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat span{display:block;font-size:12px;color:var(--print);letter-spacing:.04em}
.stat b{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

/* Mode rows */
.mode{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;cursor:pointer}
.mode:last-child{border-bottom:0}
.mode:hover:not([disabled]){background:var(--print-soft)}
.mode.primary{background:var(--print-soft)}
.mode .tag{font-family:var(--f-jp);font-weight:600;font-size:15px;color:var(--print);line-height:1.2}
.mode .tag small{display:block;font-family:var(--f-ui);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.mode b{display:block;font-size:17px;line-height:1.35}
.mode .desc{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px}
.mode .go{font-family:var(--f-form);font-weight:600;color:var(--print);font-size:16px;white-space:nowrap}
.mode[disabled]{cursor:default}
.mode[disabled] .tag,.mode[disabled] b,.mode[disabled] .go{opacity:.45}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.opt-row:last-child{border-bottom:0}
.opt-row p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.opt-row strong{display:block;color:var(--ink);font-size:16px}
.switch{position:relative;display:inline-flex;cursor:pointer;flex:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .track{background:var(--print)}
.switch input:checked + .track::after{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:2px solid var(--print);outline-offset:2px}

/* Checklist + tips */
.check{list-style:none;margin:0;padding:6px 0}
.check label{display:flex;align-items:flex-start;gap:12px;padding:8px 16px;cursor:pointer;line-height:1.5}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--print);border-radius:50%;margin:0;flex:none;background:var(--sheet);cursor:pointer;transition:background .15s}
.check input:checked{background:var(--lead);border-color:var(--lead)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.check small{display:block;color:var(--muted);font-size:13px}
.tips{margin:0;padding:12px 16px 14px 40px;display:flex;flex-direction:column;gap:8px}
.tips li{padding-left:4px}
.tips li::marker{font-family:var(--f-num);color:var(--print);font-weight:600}

/* Section picker */
.trow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow b{display:block;font-family:var(--f-jp);font-weight:600;font-size:17px}
.trow b small{font-family:var(--f-num);font-weight:500;color:var(--print);font-size:12px;margin-right:6px}
.trow span{display:block;color:var(--muted);font-size:14px}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px;max-width:220px}
.meter i{display:block;height:100%;background:var(--print)}

/* Quiz */
.qtop{display:flex;align-items:center;gap:12px}
.btn-ghost{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{border-color:var(--print)}
.btn-ghost[aria-pressed="true"]{background:var(--print-soft);border-color:var(--print);color:var(--print)}
.qtitle{font-family:var(--f-form);font-weight:600;letter-spacing:.06em;color:var(--print);flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcount{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.qcount .tl{color:var(--print);margin-right:8px}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.strip i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11px/1 var(--f-num);font-style:normal;color:var(--muted);background:var(--sheet)}
.strip i.cur{border-color:var(--print);color:var(--print);box-shadow:0 0 0 3px var(--print-soft)}
.strip i.ok{background:var(--good);border-color:var(--good);color:var(--sheet)}
.strip i.ng{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.strip i.done{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.qcard{padding:16px}
.passage{border:1px solid var(--line);border-radius:4px;margin-bottom:18px;background:var(--paper)}
.passage summary{font-family:var(--f-form);font-weight:600;letter-spacing:.05em;color:var(--print);padding:8px 12px;cursor:pointer;font-size:15px}
.ptext{padding:2px 14px 14px;font-size:17px;line-height:2}
.ptext p{margin:0 0 8px;text-indent:1em}
.ptext p.ni{text-indent:0}
.ptext p:last-child{margin-bottom:0}
.ptext h4{margin:4px 0 8px;text-align:center;font-size:18px}
.ptext table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.6;margin:6px 0 10px}
.ptext th,.ptext td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.ptext th{background:var(--print-soft);font-weight:600}
.pb{display:inline-block;min-width:2.6em;padding:0 6px;border:1.5px solid var(--muted);border-radius:3px;font:600 13px/1.5 var(--f-num);color:var(--muted);text-align:center;text-indent:0}
.pb.cur{background:var(--print-soft);border-color:var(--print);color:var(--print)}
.qnum{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.qnum .ptag{color:var(--print);font-family:var(--f-jp);font-weight:600;font-size:14px}
.furi-btn{margin-left:auto;padding:3px 10px;font-size:13px}
.prompt{font-size:20px;line-height:2;margin:0 0 14px;text-wrap:pretty}
.prompt.small{font-size:17px;line-height:1.9}
.word{font-family:var(--f-kyo);font-size:30px;font-weight:600;margin:0 0 10px;line-height:1.5}
.audio{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--print);color:var(--sheet);border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
.play svg{width:16px;height:16px;fill:currentColor}
.play.on{opacity:.75}
.note{font-size:14px;color:var(--muted);margin:0 0 12px}
.situ{background:var(--paper);border-left:3px solid var(--print);padding:8px 12px;margin:0 0 14px;font-size:16px}
.situ .ja{display:block;font-size:17px;margin-top:2px}
.transcript{background:var(--paper);border-radius:4px;padding:10px 12px;margin:0 0 12px;font-size:16px;line-height:1.9}
.transcript p{margin:0}
.transcript .sp{font:600 12px/1 var(--f-ui);color:var(--print);margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;font-size:18px;line-height:1.7;min-height:54px}
.opt.long{font-size:16px}
button.opt:hover{border-color:var(--print)}
div.opt{cursor:default}
.opt .hid{font-family:var(--f-ui);font-size:15px;color:var(--muted)}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--print);display:grid;place-items:center;font:600 14px/1 var(--f-num);color:var(--print)}
.opt.picked .bub{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.opt.picked.anim .bub{animation:fill .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{0%{transform:scale(.7);background:transparent;color:var(--print)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{font:600 13px/1.2 var(--f-ui);white-space:nowrap}
.opt.right .mk{color:var(--good)}
.opt.wrong .mk{color:var(--bad)}
.explain{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700;font-size:17px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.verdict.ok{color:var(--good)}
.verdict.ng{color:var(--bad)}
.verdict .ans{font:500 14px/1 var(--f-num);color:var(--muted)}
.explain p{margin:8px 0 0}
.explain .full{font-size:18px;line-height:2.1}
.explain .zh{color:var(--muted);font-size:15px}
.explain .tip{font-size:15px}
.qnav{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--ink);border-radius:999px;padding:12px 22px;font-weight:600;font-size:16px;cursor:pointer;background:var(--ink);color:var(--sheet)}
.btn.alt{background:var(--sheet);color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--print)}
.btn.sm{padding:8px 16px;font-size:14px}

/* Results */
.score{padding:20px 16px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.big{font:600 56px/1 var(--f-num);font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--muted)}
.score .msg2{flex:1;min-width:180px}
.score .msg2 b{display:block;font-size:18px}
.score .msg2 span{color:var(--muted);font-size:14px}
.parts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.parts span{font:500 13px/1 var(--f-num);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-variant-numeric:tabular-nums}
.parts span em{font-style:normal;font-family:var(--f-jp)}
.rlist details{border-bottom:1px solid var(--line)}
.rlist details:last-child{border-bottom:0}
.rlist summary{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;list-style:none}
.rlist summary::-webkit-details-marker{display:none}
.rlist .g{font-weight:700}
.rlist .g.ok{color:var(--good)}
.rlist .g.ng{color:var(--bad)}
.rlist .s{font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rlist .s em{font-style:normal;font-family:var(--f-ui);font-size:12px;color:var(--print);margin-right:6px}
.rlist .r{font:500 12px/1.3 var(--f-num);color:var(--muted);text-align:right;white-space:nowrap}
.rx{padding:0 16px 14px 50px;font-size:15px}
.rx p{margin:4px 0 0}
.rx .full{font-size:17px;line-height:2}
.rx .zh{color:var(--muted)}

/* Flashcards */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.chip small{font-family:var(--f-num);margin-left:4px;opacity:.75}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--print)}
.fcard{min-height:310px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:36px 20px 28px;cursor:pointer;position:relative;gap:8px;background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--print-soft) 35px 36px)}
.fpos{color:var(--print);font-size:14px}
.fword{font-family:var(--f-kyo);font-weight:600;font-size:clamp(40px,12vw,60px);line-height:1.2;overflow-wrap:anywhere}
.fread{font-family:var(--f-jp);font-size:22px;color:var(--print)}
.fzh{font-size:24px;font-weight:700}
.fex{font-size:17px;line-height:2;max-width:30ch}
.fex small{display:block;font-family:var(--f-ui);color:var(--muted);font-size:14px;line-height:1.5}
.hint{font-size:14px;color:var(--muted)}
.say{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;cursor:pointer}
.say svg{width:18px;height:18px;fill:var(--print)}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtns .btn{width:100%}
.done-card{padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done-card p{margin:0}
.done-card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Grammar reference */
.search{display:block;width:100%;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--sheet);font-size:16px}
.search:focus{outline:2px solid var(--print);outline-offset:1px}
.glist details{border-bottom:1px solid var(--line)}
.glist details:last-child{border-bottom:0}
.glist summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:11px 16px;cursor:pointer;list-style:none}
.glist summary::-webkit-details-marker{display:none}
.glist summary b{font-family:var(--f-jp);font-weight:600;font-size:18px}
.glist summary span{grid-column:1 / -1;color:var(--muted);font-size:15px;min-width:0}
.glist summary i{grid-row:1;grid-column:2;font-style:normal;font-size:12px;color:var(--print);white-space:nowrap}
.gx{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.gx .row{display:grid;grid-template-columns:3.5em 1fr;gap:8px;font-size:15px}
.gx .row > span:first-child{color:var(--print);font-size:13px;padding-top:2px}
.gx .ex{font-size:17px;line-height:2}
.gx .ex small{display:block;font-family:var(--f-ui);color:var(--muted);font-size:14px;line-height:1.5}
.gx .warn{background:var(--print-soft);border-radius:4px;padding:6px 10px;font-size:14px}
.empty{padding:20px 16px;color:var(--muted);text-align:center}
.say-sm{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);cursor:pointer;vertical-align:middle;margin-left:6px}
.say-sm svg{width:14px;height:14px;fill:var(--print)}

/* Exam info */
.itable{width:100%;border-collapse:collapse;font-size:15px}
.itable th,.itable td{border-bottom:1px solid var(--line);padding:9px 16px;text-align:left;vertical-align:top}
.itable tr:last-child th,.itable tr:last-child td{border-bottom:0}
.itable th{font-weight:600;white-space:nowrap;color:var(--print);font-size:14px;width:1%}
.itable td small{display:block;color:var(--muted);font-size:13px}
.types{margin:0;padding:10px 16px 12px 36px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.types li::marker{color:var(--print)}
.types [lang="ja"]{font-weight:600}
.warnbox{border:1px solid var(--bad);background:var(--bad-soft);border-radius:6px;padding:12px 16px;font-size:15px}
.warnbox b{color:var(--bad)}
.src{font-size:13px;color:var(--muted);margin:0;padding:10px 16px 14px;border-top:1px solid var(--line)}
.src a{word-break:break-all}

/* Word lookup: Japanese words can be tapped for the Chinese meaning */
.w{cursor:pointer;border-radius:2px;-webkit-tap-highlight-color:transparent}
.w.saved{text-decoration:underline dotted var(--print);text-decoration-thickness:1.5px;text-underline-offset:5px}
.w.on{background:var(--lead);color:var(--lead-ink);box-shadow:0 0 0 2px var(--lead);text-decoration:none}
.w.on rt{color:var(--lead-ink)}
[data-look="off"] .w,[data-look="pre"] :is(.opts,.tg,.word) .w{cursor:inherit}
.lookhint{margin:0;font-size:13px;color:var(--muted);text-align:center}
.wpop{position:fixed;z-index:30;width:340px;max-width:calc(100vw - 24px);background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.18);overflow:hidden;font-family:var(--f-ui)}
.wpop[hidden]{display:none}
.wp-band{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--print);color:var(--sheet);font:600 14px/1 var(--f-form);letter-spacing:.08em;padding-left:16px;min-height:38px}
.wp-x{width:44px;height:38px;border:0;background:none;color:inherit;font-size:16px;cursor:pointer}
.wp-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;max-height:min(62vh,480px);overflow:auto}
.wp-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wp-word{font:600 28px/1.25 var(--f-kyo);overflow-wrap:anywhere}
.wp-yomi{display:block;font-family:var(--f-jp);color:var(--print);font-size:16px;margin-top:2px}
.wp-say{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;cursor:pointer}
.wp-say svg{width:18px;height:18px;fill:var(--print)}
.wp-form{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline}
.wp-form [lang="ja"]{color:var(--ink);font-size:15px;font-family:var(--f-jp)}
.wp-steps{flex-basis:100%;color:var(--print)}
.wp-zh{font-size:20px;font-weight:700;line-height:1.4}
.wp-note{margin:0;font-size:15px;line-height:1.6}
.wp-ex{margin:2px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:16px;line-height:1.9}
.wp-ex small{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.wp-sub{margin:2px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap}
.wp-sub b{color:var(--ink);font-family:var(--f-jp)}
.wp-act{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.wp-save{display:inline-flex;align-items:center;gap:8px;min-height:38px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--ink);padding:6px 14px 6px 8px;font-size:14px;cursor:pointer}
.wp-save:hover{border-color:var(--print)}
.wp-save i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--print);flex:none}
.wp-save[aria-pressed="true"] i{background:var(--lead);border-color:var(--lead)}
.wp-save.anim i{animation:wfill .32s cubic-bezier(.2,.8,.2,1)}
.wp-more{font-size:13px;color:var(--muted)}
@keyframes wfill{from{transform:scale(.4)}to{transform:none}}
@keyframes sheet-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
/* Phone: the card rises from the bottom like a sheet; larger screens get a card beside the word */
@media (max-width:639px){
  .wpop{left:0;right:0;bottom:0;width:auto;max-width:none;border-radius:12px 12px 0 0;border-width:1px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:sheet-up .22s cubic-bezier(.2,.8,.2,1)}
  .wp-body{max-height:55vh}
}

/* Keyboard hints only where there is a keyboard and mouse */
@media (hover:hover) and (pointer:fine){
  .kbd{display:block}
  .w:hover{text-decoration:underline dotted var(--print);text-decoration-thickness:1.5px;text-underline-offset:5px}
  [data-look="off"] .w:hover,[data-look="pre"] :is(.opts,.tg,.word) .w:hover{text-decoration:none}
}

/* Tablet: wider sheet, practice modes in two columns */
@media (min-width:640px){
  .wrap{max-width:760px;padding:28px 24px 32px;gap:20px}
  .home-main,.home-side{gap:20px}
  .modes{display:grid;grid-template-columns:1fr 1fr}
  .modes .mode{border-bottom:1px solid var(--line)}
  .modes .mode.primary{grid-column:1 / -1}
  .modes .mode:not(.primary):nth-child(even){border-right:1px solid var(--line)}
  .modes .mode:not(.primary) .go{display:none}
  .modes .mode:not(.primary):last-child:nth-child(even){grid-column:1 / -1;border-right:0}
  .home-side{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .qcard{padding:20px 24px}
  .prompt{font-size:21px}
  .fcard{min-height:360px}
  .opts.grid2{display:grid;grid-template-columns:1fr 1fr}
  .wrap[data-view="result"]{max-width:860px}
  .wrap[data-view="info"]{max-width:860px}
}

/* Desktop: home in two columns; reading like the test book, passage left and answers right */
@media (min-width:1024px){
  .wrap[data-view="home"]{max-width:1120px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
  .wrap[data-view="home"] .home-side{display:flex;position:sticky;top:24px}
  .wrap[data-view="home"] .prefs{grid-column:1 / -1;margin-bottom:-8px}
  .wrap[data-view="quiz-p"]{max-width:1180px}
  .qcard.has-p{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start;overflow:visible;padding:24px}
  .qcard.has-p .passage{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;margin:0}
  .wrap[data-view="grammar"]{max-width:900px}
  .wrap[data-view="info"]{max-width:1000px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .wrap[data-view="info"] > .qtop,.wrap[data-view="info"] > .prefs{grid-column:1 / -1}
  .info-col{display:flex;flex-direction:column;gap:20px;min-width:0}
}
.info-col{display:flex;flex-direction:column;gap:16px;min-width:0}

@media (max-width:400px){
  .mode{grid-template-columns:62px 1fr}
  .mode .go{display:none}
  .stat{padding:10px 12px}
  .prompt{font-size:19px}
  .count b{font-size:38px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

お|お|pref|（客氣的接頭詞）|放在名詞前讓說法更客氣：「お茶」「お金」。「お＋ます形語幹＋します」是謙讓語（我為您…）；「お＋語幹＋になる」是尊敬語。
ご|ご|pref|（客氣的接頭詞）|放在漢語名詞前：「ご利用」「ご家族」。
# 文法題的選項片段
ら|ら|gram|（〜たら的ら）…之後；如果…|接在た形後面：「着いたら」到了之後。
たら|たら|gram|如果…的話；…之後|接在た形的位置：「雨が降ったら」。
ば|ば|gram|如果…的話|ば形的結尾：「行けば」「安ければ」。
なら|なら|prt|如果是…的話|接對方的話題給建議：「日本へ行くなら、京都がいいですよ」。
ても|ても|gram|即使…也|接在て形的位置。
たり|たり|gram|…啦…啦（舉例動作）|「〜たり〜たりする」。

  {id:"3bs1", type:"bunsho", title:"{日本:にほん}の{自動販売機:じどうはんばいき}", body:[

   zh:"來日本後讓我驚訝的事情之一，是自動販賣機很多。車站和路邊就不用說了，連山上都有自動販賣機。賣的東西也很多樣，不只飲料，還有麵包、冰淇淋，甚至連傘都有。而且到了冬天也買得到熱飲。在我的國家，自動販賣機放在外面的話，大概馬上就會被弄壞。日本自動販賣機這麼多，或許是因為這是個安全的國家。自動販賣機雖然方便，但聽說也有很耗電的問題。今後我想一邊顧及環境一邊使用。",

  {id:"3bs2", type:"bunsho", title:"{新:あたら}しい{部屋:へや}", body:[

   zh:"上個月搬到公司附近的公寓。以前的家搭電車要花一個小時，現在走路十分鐘就到。早上可以慢慢睡，非常輕鬆。不過，新房間有點小，所以必須減少行李。搬家那天去向隔壁鄰居打招呼，因為聽說在日本搬家後要向鄰居打招呼。隔壁的老奶奶非常親切，仔細地教了我倒垃圾的方法。",

  {id:"3r5", type:"chu", title:"{一人旅:ひとりたび}", body:[
    "{私:わたし}は{去年:きょねん}から、{休:やす}みの{日:ひ}に{一人:ひとり}で{旅行:りょこう}をするようになった。{以前:いぜん}は、{友達:ともだち}と{一緒:いっしょ}でなければ{旅行:りょこう}には{行:い}けないと{思:おも}っていた。{一人:ひとり}で{食事:しょくじ}をするのも{恥:は}ずかしかったし、{道:みち}に{迷:まよ}ったらどうしようと{心配:しんぱい}だったからだ。",
    "ところが{去年:きょねん}の{夏:なつ}、{一緒:いっしょ}に{行:い}く{予定:よてい}だった{友達:ともだち}が{急:きゅう}に{行:い}けなくなり、しかたなく{一人:ひとり}で{京都:きょうと}へ{行:い}った。すると、{思:おも}っていたよりずっと{楽:たの}しかった。{好:す}きな{時間:じかん}に{起:お}きて、{見:み}たい{所:ところ}だけをゆっくり{見:み}ることができる。{疲:つか}れたら、{予定:よてい}を{変:か}えてホテルで{休:やす}んでもいい。",
    "{一人:ひとり}だと、その{土地:とち}の{人:ひと}に{話:はな}しかけられることも{多:おお}い。{京都:きょうと}では、{店:みせ}のおばあさんがおすすめの{食堂:しょくどう}を{教:おし}えてくれた。{友達:ともだち}との{旅行:りょこう}も{楽:たの}しいが、{一人旅:ひとりたび}には{一人旅:ひとりたび}のよさがあると{思:おも}う。"],
   zh:"我從去年開始，會在假日一個人去旅行。以前我認為沒有朋友一起就不能去旅行。因為一個人吃飯很難為情，也擔心迷路怎麼辦。可是去年夏天，本來要一起去的朋友突然不能去了，我只好一個人去京都。結果比想像中開心得多。可以在喜歡的時間起床，只慢慢看想看的地方。累了也可以改變行程在飯店休息。一個人的話，也常有當地人來搭話。在京都，店裡的老奶奶告訴我她推薦的餐館。和朋友旅行也很開心，但我覺得一個人旅行有一個人旅行的好處。",

    {q:"{一人:ひとり}で{京都:きょうと}へ{行:い}ったのはどうしてですか。", o:["{一緒:いっしょ}に{行:い}くはずだった{友達:ともだち}が{行:い}けなくなったから","{一人旅:ひとりたび}をしてみたかったから","{京都:きょうと}に{住:す}んでいるおばあさんに{会:あ}いたかったから","ホテルでゆっくり{休:やす}みたかったから"], note:"「一緒に行く予定だった友達が急に行けなくなり、しかたなく一人で」。"},
    {q:"この{人:ひと}は、{一人旅:ひとりたび}のよさは{何:なん}だと{言:い}っていますか。", o:["{自分:じぶん}の{好:す}きなように{予定:よてい}を{決:き}めたり{変:か}えたりできること","お{金:かね}をあまり{使:つか}わなくてもいいこと","{友達:ともだち}と{行:い}くより{安全:あんぜん}なこと","{有名:ゆうめい}な{所:ところ}をたくさん{見:み}られること"], note:"第二段：喜歡的時間起床、只看想看的地方、累了可以改行程 → 能照自己的意思安排。"}]},
  {id:"3r6", type:"chu", title:"{寝:ね}る{前:まえ}のスマートフォン", body:[
    "{最近:さいきん}、{夜:よる}なかなか{眠:ねむ}れないという{人:ひと}が{増:ふ}えているそうだ。{原因:げんいん}の{一:ひと}つは、{寝:ね}る{前:まえ}にスマートフォンを{見:み}ることだと{言:い}われている。{画面:がめん}の{光:ひかり}を{見:み}ると、{頭:あたま}が{今:いま}は{昼:ひる}だと{勘違:かんちが}いして、{目:め}が{覚:さ}めてしまうのだ。",
    "{私:わたし}も{以前:いぜん}は、{布団:ふとん}の{中:なか}で{一時間:いちじかん}{以上:いじょう}スマートフォンを{見:み}ていた。そのせいか、{朝:あさ}{起:お}きても{疲:つか}れが{取:と}れず、{授業:じゅぎょう}{中:ちゅう}に{眠:ねむ}くなることが{多:おお}かった。",
    "そこで、{寝:ね}る{三十分:さんじゅっぷん}{前:まえ}になったらスマートフォンを{別:べつ}の{部屋:へや}に{置:お}き、{代:か}わりに{紙:かみ}の{本:ほん}を{読:よ}むことにした。{初:はじ}めの{数日:すうじつ}は{落:お}ち{着:つ}かなかったが、{一週間:いっしゅうかん}ほどで{自然:しぜん}に{眠:ねむ}くなるようになった。{今:いま}では{朝:あさ}もすっきり{起:お}きられる。"],
   zh:"聽說最近晚上睡不著的人越來越多。原因之一據說是睡前看手機。看了螢幕的光，大腦會誤以為現在是白天，就清醒過來了。我以前也會在被窩裡看手機一個小時以上。或許是因為這樣，早上起來疲勞也沒消除，上課時常常想睡。所以我決定睡前三十分鐘就把手機放到別的房間，改讀紙本書。頭幾天靜不下來，但大約一週後就會自然地想睡了。現在早上也能神清氣爽地起床。",
   qs:[
    {q:"スマートフォンを{見:み}ると{眠:ねむ}れなくなるのはなぜだと{言:い}っていますか。", o:["{画面:がめん}の{光:ひかり}のせいで、{頭:あたま}が{昼:ひる}だと{思:おも}ってしまうから","おもしろくて{長:なが}い{時間:じかん}{見:み}てしまうから","{目:め}が{疲:つか}れて{痛:いた}くなるから","{寝:ね}る{時間:じかん}が{遅:おそ}くなるから"], note:"第一段：「画面の光を見ると、頭が今は昼だと勘違いして、目が覚めてしまう」。"},
    {q:"{以前:いぜん}、この{人:ひと}にはどんな{問題:もんだい}がありましたか。", o:["{朝:あさ}になっても{疲:つか}れていて、{授業:じゅぎょう}{中:ちゅう}に{眠:ねむ}くなった","{夜:よる}、{本:ほん}を{読:よ}むと{目:め}が{覚:さ}めてしまった","スマートフォンをなくすことが{多:おお}かった","{朝:あさ}、{早:はや}く{起:お}きすぎてしまった"], note:"第二段：「朝起きても疲れが取れず、授業中に眠くなることが多かった」。"},
    {q:"この{人:ひと}が{今:いま}していることは{何:なん}ですか。", o:["{寝:ね}る{前:まえ}はスマートフォンを{別:べつ}の{部屋:へや}に{置:お}いて、{本:ほん}を{読:よ}む","{寝:ね}る{三十分:さんじゅっぷん}{前:まえ}まで{布団:ふとん}の{中:なか}でスマートフォンを{見:み}る","{朝:あさ}{起:お}きてから{紙:かみ}の{本:ほん}を{読:よ}む","{授業:じゅぎょう}{中:ちゅう}はスマートフォンを{使:つか}わないようにする"], note:"第三段：睡前三十分鐘把手機放到別的房間，改讀紙本書。"}]},

  {id:"3r7", type:"cho", title:"{町:まち}の{小:ちい}さな{本屋:ほんや}", body:[
    "{私:わたし}の{家:いえ}の{近:ちか}くに、{小:ちい}さな{本屋:ほんや}がある。{店:みせ}の{主人:しゅじん}の{鈴木:すずき}さんは{七十歳:ななじゅっさい}を{過:す}ぎているが、{今:いま}も{毎日:まいにち}{一人:ひとり}で{店:みせ}を{開:あ}けている。インターネットで{本:ほん}を{買:か}う{人:ひと}が{増:ふ}えて、{町:まち}の{本屋:ほんや}は{次々:つぎつぎ}に{閉:し}まっている。それなのに、なぜこの{店:みせ}は{続:つづ}いているのだろうか。",
    "ある{日:ひ}、{私:わたし}は{鈴木:すずき}さんに{聞:き}いてみた。すると{鈴木:すずき}さんは「お{客:きゃく}さんと{話:はな}すのが{好:す}きだからですよ」と{笑:わら}った。この{店:みせ}では、お{客:きゃく}さんが{探:さが}している{本:ほん}がなくても、{鈴木:すずき}さんが{代:か}わりにその{人:ひと}に{合:あ}いそうな{本:ほん}を{選:えら}んでくれる。{私:わたし}も{以前:いぜん}、{料理:りょうり}の{本:ほん}を{探:さが}しに{行:い}ったのに、{勧:すす}められた{旅行:りょこう}の{本:ほん}を{買:か}って{帰:かえ}ったことがある。[それ]が{思:おも}っていた{以上:いじょう}におもしろかった。",
    "インターネットなら、{欲:ほ}しい{本:ほん}をすぐに{見:み}つけることができる。しかし、{自分:じぶん}が{知:し}らない{世界:せかい}の{本:ほん}に{出会:であ}うことは{少:すく}ない。{鈴木:すずき}さんの{店:みせ}には、{思:おも}いがけない{本:ほん}との{出会:であ}いがある。{私:わたし}はそれを{楽:たの}しみに、{今:いま}も{月:つき}に{二回:にかい}はこの{店:みせ}に{通:かよ}っている。",
    "{町:まち}の{本屋:ほんや}が{続:つづ}いていくためには、{本:ほん}を{売:う}るだけでなく、{人:ひと}と{本:ほん}をつなぐ{場所:ばしょ}になることが{大切:たいせつ}なのではないだろうか。"],
   zh:"我家附近有一間小書店。店主鈴木先生已經七十多歲，現在仍每天一個人開店。上網買書的人變多，城鎮裡的書店一間接一間地關門。儘管如此，為什麼這家店還能經營下去呢？有一天我問了鈴木先生。他笑著說：「因為我喜歡和客人聊天啊。」在這家店，就算沒有客人在找的書，鈴木先生也會改為挑選適合那個人的書。我以前也曾經去找料理書，結果買了他推薦的旅遊書回家。那本書比想像中還有趣。在網路上可以馬上找到想要的書，但很少能遇到自己不知道的領域的書。鈴木先生的店裡有和意想不到的書相遇的機會。我期待著這一點，現在每個月仍會去這家店兩次左右。城鎮的書店要繼續經營下去，除了賣書，成為連結人與書的地方，不是很重要嗎？",
   qs:[
    {q:"{町:まち}の{本屋:ほんや}が{次々:つぎつぎ}に{閉:し}まっている{理由:りゆう}は{何:なん}ですか。", o:["インターネットで{本:ほん}を{買:か}う{人:ひと}が{増:ふ}えたから","{店:みせ}の{主人:しゅじん}が{年:とし}を{取:と}ったから","{本:ほん}を{読:よ}む{人:ひと}がいなくなったから","{本:ほん}の{値段:ねだん}が{高:たか}くなったから"], note:"第一段：「インターネットで本を買う人が増えて、町の本屋は次々に閉まっている」。"},
    {q:"「それ」は{何:なに}を{指:さ}していますか。", o:["{鈴木:すずき}さんに{勧:すす}められた{旅行:りょこう}の{本:ほん}","{探:さが}しに{行:い}った{料理:りょうり}の{本:ほん}","{鈴木:すずき}さんと{話:はな}したこと","{本屋:ほんや}に{通:かよ}うこと"], note:"「それ」指前一句買回家的「勧められた旅行の本」。"},
    {q:"この{人:ひと}は、インターネットで{本:ほん}を{買:か}うことについてどう{考:かんが}えていますか。", o:["{欲:ほ}しい{本:ほん}はすぐ{見:み}つかるが、{知:し}らない{本:ほん}に{出会:であ}うことは{少:すく}ない","{本屋:ほんや}より{安:やす}く{買:か}えるので{便利:べんり}だ","{自分:じぶん}に{合:あ}う{本:ほん}を{選:えら}んでもらえる","{本屋:ほんや}がなくなるので、やめたほうがいい"], note:"第三段：「欲しい本をすぐに見つけることができる。しかし、自分が知らない世界の本に出会うことは少ない」。"},
    {q:"この{文章:ぶんしょう}で{一番:いちばん}{言:い}いたいことは{何:なん}ですか。", o:["{町:まち}の{本屋:ほんや}は、{人:ひと}と{本:ほん}をつなぐ{場所:ばしょ}になることが{大切:たいせつ}だ","{町:まち}の{本屋:ほんや}は、インターネットより{安:やす}く{本:ほん}を{売:う}るべきだ","{本:ほん}はインターネットで{買:か}わないほうがいい","{本屋:ほんや}は{若:わか}い{人:ひと}が{続:つづ}けていくべきだ"], note:"最後一段是作者的主張：「人と本をつなぐ場所になることが大切なのではないだろうか」（〜ではないだろうか＝我認為…）。"}]},

  {id:"3r8", type:"joho", title_zh:"課程表", title:"さくら{市:し}　{市民:しみん}{講座:こうざ}（{春:はる}）", body:[
    {table:[["{講座:こうざ}","{日時:にちじ}","{料金:りょうきん}","{定員:ていいん}"],
            ["A　はじめてのパソコン","{毎週:まいしゅう}{月曜日:げつようび}\n10:00〜12:00","3,000{円:えん}","15{人:にん}"],
            ["B　{日本:にほん}の{家庭料理:かていりょうり}","{毎週:まいしゅう}{水曜日:すいようび}\n18:30〜20:30","5,000{円:えん}\n（{材料費:ざいりょうひ}を{含:ふく}む）","12{人:にん}"],
            ["C　やさしいヨガ","{毎週:まいしゅう}{土曜日:どようび}\n9:00〜10:00","2,000{円:えん}","20{人:にん}"],
            ["D　{写真:しゃしん}の{撮:と}り{方:かた}","{毎週:まいしゅう}{日曜日:にちようび}\n14:00〜16:00","4,000{円:えん}\n（カメラは{各自:かくじ}で{用意:ようい}）","10{人:にん}"]]},
    "!・どの{講座:こうざ}も{四月:しがつ}から{六月:ろくがつ}まで、{全部:ぜんぶ}で{十回:じゅっかい}です。",
    "!・{申:もう}し{込:こ}みは{三月:さんがつ}{十日:とおか}までに、{市役所:しやくしょ}の{窓口:まどぐち}かホームページでしてください。",
    "!・{定員:ていいん}より{申:もう}し{込:こ}みが{多:おお}い{場合:ばあい}は、{抽選:ちゅうせん}になります。",
    "!・さくら{市:し}に{住:す}んでいるか、さくら{市:し}で{働:はたら}いている{人:ひと}が{申:もう}し{込:こ}めます。"],
   zh:"櫻花市市民講座（春季）。A 第一次學電腦：每週一 10:00–12:00，3,000 日圓，名額 15 人。B 日本家常菜：每週三 18:30–20:30，5,000 日圓（含材料費），12 人。C 簡單瑜伽：每週六 9:00–10:00，2,000 日圓，20 人。D 拍照技巧：每週日 14:00–16:00，4,000 日圓（相機請自備），10 人。每個講座都是四月到六月，共十次。請在三月十日前到市公所窗口或網站報名。報名人數超過名額時抽籤。住在櫻花市或在櫻花市工作的人可以報名。",
   qs:[
    {q:"{会社員:かいしゃいん}のマリアさんは、{平日:へいじつ}は{夜:よる}{七時:しちじ}まで{仕事:しごと}があります。{週末:しゅうまつ}は{午前:ごぜん}だけ{時間:じかん}があります。マリアさんが{受:う}けられる{講座:こうざ}はどれですか。", o:["C","A","B","D"], fixed:[1,2,0,3], note:"平日白天到晚上七點都在工作 → A（週一上午）、B（週三 18:30 開始）都不行；週末只有上午有空 → C（週六 9:00）可以，D 是週日下午。"},
    {q:"{講座:こうざ}に{申:もう}し{込:こ}みたい{人:ひと}は、どうしなければなりませんか。", o:["{三月:さんがつ}{十日:とおか}までに、{市役所:しやくしょ}の{窓口:まどぐち}かホームページで{申:もう}し{込:こ}む","{四月:しがつ}の{最初:さいしょ}の{講座:こうざ}の{日:ひ}に{申:もう}し{込:こ}む","{定員:ていいん}になる{前:まえ}に{電話:でんわ}で{申:もう}し{込:こ}む","{料金:りょうきん}を{払:はら}ってから{抽選:ちゅうせん}を{待:ま}つ"], note:"「申し込みは三月十日までに、市役所の窓口かホームページで」。"}]},
  {id:"3r9", type:"joho", title_zh:"公告", title:"{駅前:えきまえ}{自転車:じてんしゃ}{置:お}き{場:ば}　ご{利用:りよう}{案内:あんない}", body:[
    {table:[["","{一日:いちにち}","{一:いっ}か{月:げつ}","{三:さん}か{月:げつ}"],
            ["{自転車:じてんしゃ}","150{円:えん}","1,800{円:えん}","5,000{円:えん}"],
            ["バイク","300{円:えん}","3,500{円:えん}","9,500{円:えん}"]]},
    "!・{一日:いちにち}の{利用:りよう}は、{入:い}り{口:ぐち}の{機械:きかい}でお{金:かね}を{払:はら}ってください。",
    "!・{一:いっ}か{月:げつ}と{三:さん}か{月:げつ}の{利用:りよう}は、{駅前:えきまえ}の{事務所:じむしょ}で{申:もう}し{込:こ}んでください（{月:げつ}〜{金:きん}　9:00〜17:00）。",
    "!・{学生:がくせい}は{学生証:がくせいしょう}を{見:み}せると、{一:いっ}か{月:げつ}と{三:さん}か{月:げつ}の{料金:りょうきん}が{二割:にわり}{安:やす}くなります。",
    "!・{夜:よる}{十二時:じゅうにじ}から{朝:あさ}{五時:ごじ}までは、{自転車:じてんしゃ}を{出:だ}したり{入:い}れたりすることはできません。"],
   zh:"車站前腳踏車停車場使用說明。腳踏車：一天 150 日圓、一個月 1,800 日圓、三個月 5,000 日圓；機車：一天 300、一個月 3,500、三個月 9,500 日圓。只停一天的話，請在入口的機器付錢。一個月和三個月的使用，請到車站前的辦公室申請（週一到週五 9:00–17:00）。學生出示學生證，一個月和三個月的費用打八折。晚上十二點到早上五點不能停放或取出腳踏車。",
   qs:[
    {q:"{大学生:だいがくせい}のキムさんは、{自転車:じてんしゃ}を{三:さん}か{月:げつ}{置:お}きたいと{思:おも}っています。{学生証:がくせいしょう}を{見:み}せると、いくら{払:はら}いますか。", o:["4,000{円:えん}","5,000{円:えん}","1,440{円:えん}","3,000{円:えん}"], fixed:[2,3,0,1], note:"腳踏車三個月 5,000 日圓，學生便宜兩成（二割）：5,000 × 0.8 ＝ 4,000 日圓。"},
    {q:"{一:いっ}か{月:げつ}の{利用:りよう}を{申:もう}し{込:こ}みたいとき、どうしますか。", o:["{平日:へいじつ}の{昼間:ひるま}に{駅前:えきまえ}の{事務所:じむしょ}へ{行:い}く","{入:い}り{口:ぐち}の{機械:きかい}でお{金:かね}を{払:はら}う","{夜:よる}{十二時:じゅうにじ}までに{電話:でんわ}をする","{学生証:がくせいしょう}を{機械:きかい}に{入:い}れる"], note:"「一か月と三か月の利用は、駅前の事務所で申し込んでください（月〜金 9:00〜17:00）」。入口的機器只用在一天的使用。"}]}
];

  {id:"3l1-2", type:"kadai", intro:"{大学:だいがく}で{男:おとこ}の{学生:がくせい}と{女:おんな}の{学生:がくせい}が{話:はな}しています。", q:"{女:おんな}の{学生:がくせい}は{明日:あした}{何:なに}を{持:も}っていきますか。", lines:[
    ["m","{明日:あした}のグループ{発表:はっぴょう}の{練習:れんしゅう}、パソコン{持:も}ってこられる？"],
    ["f","うん、{持:も}っていくよ。プロジェクターも{借:か}りておこうか。"],
    ["m","プロジェクターは{教室:きょうしつ}にあるから{大丈夫:だいじょうぶ}。それより、{発表:はっぴょう}で{使:つか}う{写真:しゃしん}、{印刷:いんさつ}してきてくれない？"],
    ["f","{写真:しゃしん}はパソコンで{見:み}せればいいんじゃない？"],
    ["m","そうか。じゃ、{印刷:いんさつ}はいいや。あ、{先生:せんせい}に{出:だ}すレポートのコピーだけお{願:ねが}い。"],
    ["f","わかった。"]],
   o:["パソコンとレポートのコピー","パソコンとプロジェクター","パソコンと{印刷:いんさつ}した{写真:しゃしん}","レポートのコピーと{印刷:いんさつ}した{写真:しゃしん}"],
   zh:"男：明天小組報告的練習，妳能帶電腦來嗎？女：嗯，我會帶去。投影機也要先借嗎？男：投影機教室有，沒關係。比起這個，可以把報告要用的照片印出來帶來嗎？女：照片用電腦給大家看就好了吧？男：也對，那就不用印了。啊，只要麻煩妳帶要交給老師的報告影本。女：好。", note:"電腦要帶；投影機教室有；照片「印刷はいいや」不用印；最後追加「レポートのコピーだけお願い」。"},
  {id:"3l1-3", type:"kadai", intro:"{病院:びょういん}の{受付:うけつけ}で{女:おんな}の{人:ひと}と{受付:うけつけ}の{人:ひと}が{話:はな}しています。", q:"{女:おんな}の{人:ひと}はこのあとまず{何:なに}をしますか。", lines:[
    ["f","すみません、この{病院:びょういん}は{初:はじ}めてなんですが。"],
    ["m","では、こちらの{紙:かみ}にお{名前:なまえ}とご{住所:じゅうしょ}を{書:か}いてください。それから、{保険証:ほけんしょう}をお{願:ねが}いします。"],
    ["f","あ、{保険証:ほけんしょう}を{家:いえ}に{忘:わす}れてしまいました。"],
    ["m","そうですか。では{今日:きょう}は{全部:ぜんぶ}のお{金:かね}を{払:はら}っていただいて、{次:つぎ}にいらっしゃるときに{保険証:ほけんしょう}を{見:み}せてください。そのときに{返:かえ}しますので。"],
    ["f","わかりました。"],
    ["m","では、まず{熱:ねつ}を{測:はか}ってから、こちらの{紙:かみ}を{書:か}いてください。"],
    ["f","はい。"]],
   o:["{熱:ねつ}を{測:はか}る","{紙:かみ}に{名前:なまえ}と{住所:じゅうしょ}を{書:か}く","{家:いえ}に{保険証:ほけんしょう}を{取:と}りに{帰:かえ}る","お{金:かね}を{払:はら}う"],
   zh:"女：不好意思，我是第一次來這家醫院。男：那請在這張紙上寫姓名和地址，然後請給我健保卡。女：啊，我把健保卡忘在家裡了。男：這樣啊，那今天請先付全額，下次來的時候再出示健保卡，到時候會退錢給您。女：好的。男：那請先量體溫，再填這張紙。女：好。", note:"最後的指示「まず熱を測ってから、こちらの紙を書いてください」→ 先量體溫。付錢是看完診之後。"},
  {id:"3l1-4", type:"kadai", intro:"{男:おとこ}の{人:ひと}と{市役所:しやくしょ}の{人:ひと}が{電話:でんわ}で{話:はな}しています。", q:"{男:おとこ}の{人:ひと}はこのあとまず{何:なに}をしますか。", lines:[
    ["m","すみません、{古:ふる}いソファーを{捨:す}てたいんですが。"],
    ["f","{大:おお}きいごみですね。まず、インターネットか{電話:でんわ}で{申:もう}し{込:こ}んでください。そのあと、コンビニで{手数料:てすうりょう}のシールを{買:か}って、ソファーに{貼:は}ってください。"],
    ["m","{電話:でんわ}でも{申:もう}し{込:こ}めるんですか。"],
    ["f","はい、この{電話:でんわ}で{受:う}け{付:つ}けますよ。では、お{名前:なまえ}とご{住所:じゅうしょ}をお{願:ねが}いします。"],
    ["m","はい。{名前:なまえ}は…。"]],
   o:["{名前:なまえ}と{住所:じゅうしょ}を{言:い}う","インターネットで{申:もう}し{込:こ}む","コンビニでシールを{買:か}う","ソファーにシールを{貼:は}る"],
   zh:"男：不好意思，我想丟一張舊沙發。女：是大型垃圾吧。首先請用網路或電話申請。之後在便利商店買手續費貼紙，貼在沙發上。男：用電話也能申請嗎？女：是的，這通電話就可以受理。那麼請告訴我您的姓名和地址。男：好，我的名字是……", note:"現在這通電話就能申請 → 先說姓名和地址。買貼紙、貼貼紙是之後的事。"},
  {id:"3l1-5", type:"kadai", intro:"{大学:だいがく}で{先生:せんせい}と{男:おとこ}の{学生:がくせい}が{話:はな}しています。", q:"{学生:がくせい}は{何:なに}を{直:なお}さなければなりませんか。", lines:[
    ["f","{奨学金:しょうがくきん}の{申込書:もうしこみしょ}、{読:よ}みましたよ。だいたいいいんだけど、{二:ふた}つ{気:き}になるところがあって。"],
    ["m","はい。"],
    ["f","まず、{住所:じゅうしょ}が{前:まえ}の{住所:じゅうしょ}のままになってますね。"],
    ["m","あ、{先月:せんげつ}{引:ひ}っ{越:こ}したんです。すみません。"],
    ["f","それから、{申:もう}し{込:こ}む{理由:りゆう}のところは、もう{少:すこ}し{短:みじか}くしたほうがいいかと{思:おも}ったんだけど…{読:よ}み{直:なお}したら、これで{大丈夫:だいじょうぶ}ですね。{写真:しゃしん}もいいです。"],
    ["m","わかりました。ありがとうございます。"]],
   o:["{住所:じゅうしょ}","{申:もう}し{込:こ}む{理由:りゆう}","{写真:しゃしん}","{住所:じゅうしょ}と{申:もう}し{込:こ}む{理由:りゆう}"],
   zh:"女：獎學金申請表我看過了。大致上沒問題，不過有兩個地方我比較在意。男：是。女：首先，地址還是以前的地址。男：啊，我上個月搬家了，不好意思。女：還有，申請理由那部分，我本來覺得最好再短一點……重看一次之後，這樣就可以了。照片也沒問題。男：我知道了，謝謝老師。", note:"理由「読み直したら、これで大丈夫」不用改；照片也OK。只有地址要改。"},

  {id:"3l2-1", type:"point", intro:"{会社:かいしゃ}で{男:おとこ}の{人:ひと}と{女:おんな}の{人:ひと}が{話:はな}しています。", q:"{女:おんな}の{人:ひと}はどうして{会社:かいしゃ}に{遅:おく}れましたか。", lines:[
    ["m","おはよう。{珍:めずら}しいね、{遅刻:ちこく}なんて。{電車:でんしゃ}が{止:と}まってたの？"],
    ["f","ううん、{電車:でんしゃ}は{大丈夫:だいじょうぶ}だったんだけど、{家:いえ}を{出:で}てから{携帯:けいたい}を{忘:わす}れたことに{気:き}がついて。"],
    ["m","{取:と}りに{帰:かえ}ったんだ。"],
    ["f","うん。それで{一本:いっぽん}{遅:おそ}い{電車:でんしゃ}になっちゃって。"],
    ["m","そうか。{寝坊:ねぼう}したのかと{思:おも}った。"]],
   o:["{忘:わす}れた{携帯電話:けいたいでんわ}を{取:と}りに{帰:かえ}ったから","{電車:でんしゃ}が{止:と}まっていたから","{寝坊:ねぼう}したから","{電車:でんしゃ}を{乗:の}り{間違:まちが}えたから"],
   zh:"男：早。真難得，妳會遲到。電車停駛了嗎？女：沒有，電車沒問題，是出門之後才發現忘了帶手機。男：所以回去拿了啊。女：嗯，結果晚了一班電車。男：這樣啊，我還以為妳睡過頭了。", note:"電車沒問題、也不是睡過頭；是回家拿忘記的手機。"},
  {id:"3l2-2", type:"point", intro:"{女:おんな}の{人:ひと}と{男:おとこ}の{人:ひと}が{話:はな}しています。", q:"{男:おとこ}の{人:ひと}は{新:あたら}しいアパートの{何:なに}が{不満:ふまん}だと{言:い}っていますか。", lines:[
    ["f","{新:あたら}しいアパートはどう？{駅:えき}から{近:ちか}いんでしょう？"],
    ["m","うん、{歩:ある}いて{五分:ごふん}だから{便利:べんり}だよ。{部屋:へや}も{広:ひろ}いし、{家賃:やちん}も{前:まえ}より{安:やす}いんだ。"],
    ["f","いいじゃない。"],
    ["m","でも、{窓:まど}が{北:きた}{向:む}きで、{一日中:いちにちじゅう}{暗:くら}いんだよね。{洗濯物:せんたくもの}もなかなか{乾:かわ}かなくて。"],
    ["f","それは{困:こま}るね。"]],
   o:["{部屋:へや}に{日:ひ}が{入:はい}らないこと","{駅:えき}から{遠:とお}いこと","{部屋:へや}が{狭:せま}いこと","{家賃:やちん}が{高:たか}いこと"],
   zh:"女：新公寓怎麼樣？離車站很近吧？男：嗯，走路五分鐘很方便。房間也寬，房租也比以前便宜。女：很好啊。男：可是窗戶朝北，整天都很暗。洗的衣服也很難乾。女：那真傷腦筋。", note:"「でも」後面是不滿：窗戶朝北、整天很暗 → 照不到陽光。"},
  {id:"3l2-3", type:"point", intro:"{男:おとこ}の{学生:がくせい}と{女:おんな}の{学生:がくせい}が{話:はな}しています。", q:"{女:おんな}の{学生:がくせい}は{今週末:こんしゅうまつ}、{何:なに}をしますか。", lines:[
    ["m","{今週末:こんしゅうまつ}、みんなで{海:うみ}に{行:い}くんだけど、{一緒:いっしょ}に{行:い}かない？"],
    ["f","{行:い}きたいけど、{月曜日:げつようび}にテストがあるんだ。"],
    ["m","そっか。じゃあ{図書館:としょかん}で{勉強:べんきょう}？"],
    ["f","ううん、{図書館:としょかん}は{週末:しゅうまつ}{混:こ}んでるから、{家:いえ}でやるつもり。{土曜日:どようび}の{夜:よる}は{妹:いもうと}の{誕生日:たんじょうび}だから、{家族:かぞく}で{食事:しょくじ}もするし。"],
    ["m","そうなんだ。テスト、がんばってね。"]],
   o:["{家:いえ}でテストの{勉強:べんきょう}をする","{友達:ともだち}と{海:うみ}に{行:い}く","{図書館:としょかん}で{勉強:べんきょう}する","{妹:いもうと}とプレゼントを{買:か}いに{行:い}く"],
   zh:"男：這週末大家要去海邊，要不要一起去？女：很想去，可是星期一有考試。男：這樣啊，那妳要在圖書館讀書？女：不，週末圖書館很擠，我打算在家讀。星期六晚上是妹妹生日，還要和家人一起吃飯。男：原來如此，考試加油。", note:"「図書館は週末混んでるから、家でやるつもり」→ 在家讀書。"},
  {id:"3l2-4", type:"point", intro:"{会社:かいしゃ}の{面接:めんせつ}で{女:おんな}の{人:ひと}と{男:おとこ}の{人:ひと}が{話:はな}しています。", q:"{男:おとこ}の{人:ひと}がこの{会社:かいしゃ}を{選:えら}んだ{一番:いちばん}の{理由:りゆう}は{何:なん}ですか。", lines:[
    ["f","どうしてうちの{会社:かいしゃ}を{選:えら}んだんですか。"],
    ["m","はい。こちらの{会社:かいしゃ}は{給料:きゅうりょう}もいいですし、{家:いえ}からも{近:ちか}いです。でも、{一番:いちばん}の{理由:りゆう}は、{海外:かいがい}で{働:はたら}くチャンスがあることです。{大学:だいがく}で{勉強:べんきょう}した{英語:えいご}を{仕事:しごと}で{使:つか}いたいと{思:おも}っています。"],
    ["f","そうですか。"]],
   o:["{外国:がいこく}で{働:はたら}けるかもしれないから","{給料:きゅうりょう}がいいから","{家:いえ}から{近:ちか}いから","{英語:えいご}を{勉強:べんきょう}できるから"],
   zh:"女：為什麼選擇我們公司？男：是的。貴公司薪水好，離家也近。不過最主要的理由，是有到海外工作的機會。我想在工作上使用大學學的英文。女：這樣啊。", note:"「一番の理由は、海外で働くチャンスがあること」。英文是大學已經學過，想在工作中使用。"},
  {id:"3l2-5", type:"point", intro:"{会社:かいしゃ}で{女:おんな}の{人:ひと}と{男:おとこ}の{人:ひと}が{話:はな}しています。", q:"{女:おんな}の{人:ひと}のパソコンはどうなっていますか。", lines:[
    ["f","{佐藤:さとう}さん、ちょっとパソコンを{見:み}てもらえませんか。"],
    ["m","どうしたんですか。{電源:でんげん}が{入:はい}らないとか？"],
    ["f","いえ、{電源:でんげん}は{入:はい}るし、メールも{見:み}られるんですけど、{印刷:いんさつ}ができないんです。"],
    ["m","プリンターの{紙:かみ}は{入:はい}ってますか。"],
    ["f","はい、{確認:かくにん}しました。{他:ほか}の{人:ひと}のパソコンからは{印刷:いんさつ}できるんです。"],
    ["m","じゃあ、パソコンの{設定:せってい}の{問題:もんだい}ですね。ちょっと{見:み}てみます。"]],
   o:["{印刷:いんさつ}ができない","{電源:でんげん}が{入:はい}らない","メールが{見:み}られない","プリンターの{紙:かみ}がない"],
   zh:"女：佐藤先生，可以幫我看一下電腦嗎？男：怎麼了？開不了機嗎？女：不是，可以開機，也能看郵件，但是不能列印。男：印表機有放紙嗎？女：有，我確認過了。從別人的電腦就可以列印。男：那是電腦設定的問題了，我看看。", note:"「電源は入るし、メールも見られるんですけど、印刷ができないんです」。"},

  {id:"3l3-1", type:"gaiyo", intro:"ラジオで{男:おとこ}の{人:ひと}が{話:はな}しています。", q:"{男:おとこ}の{人:ひと}が{一番:いちばん}{言:い}いたいことは{何:なん}ですか。", lines:[
    ["m","みなさんは{朝:あさ}、{何時:なんじ}に{起:お}きていますか。{私:わたし}は{以前:いぜん}、{夜:よる}{遅:おそ}くまで{仕事:しごと}をして、{朝:あさ}はぎりぎりまで{寝:ね}ていました。でも、{去年:きょねん}から{毎朝:まいあさ}{五時:ごじ}に{起:お}きるようにしています。{朝:あさ}は{電話:でんわ}もメールも{来:こ}ないので、{仕事:しごと}がとても{進:すす}みます。{夜:よる}{早:はや}く{寝:ね}るようになったので、{体:からだ}の{調子:ちょうし}もよくなりました。みなさんも、{一度:いちど}{試:ため}してみてはどうでしょうか。"]],
   o:["{早:はや}く{起:お}きることのよさ","{夜:よる}{遅:おそ}くまで{仕事:しごと}をすることのよさ","{朝:あさ}メールを{見:み}ることの{大切:たいせつ}さ","{体:からだ}の{調子:ちょうし}を{知:し}る{方法:ほうほう}"],
   zh:"各位早上幾點起床呢？我以前會工作到深夜，早上睡到最後一刻。不過從去年開始，我每天早上五點起床。早上沒有電話也沒有郵件，工作進展得很順利。因為晚上變得早睡，身體狀況也變好了。大家要不要也試一次看看呢？", note:"整段在說早起的好處（工作順利、身體變好），最後建議大家試試看。"},
  {id:"3l3-2", type:"gaiyo", intro:"{男:おとこ}の{人:ひと}と{女:おんな}の{人:ひと}が{映画:えいが}について{話:はな}しています。", q:"{女:おんな}の{人:ひと}は{映画:えいが}についてどう{思:おも}っていますか。", lines:[
    ["m","{昨日:きのう}{見:み}た{映画:えいが}、どうだった？{今:いま}、{話題:わだい}になってるやつでしょう？"],
    ["f","うん。{俳優:はいゆう}はみんな{上手:じょうず}だったし、{音楽:おんがく}もよかったよ。でも、{話:はなし}が{途中:とちゅう}から{全然:ぜんぜん}わからなくなっちゃって。{終:お}わったあとも、{結局:けっきょく}どういうことだったのか…。"],
    ["m","そうなんだ。"],
    ["f","{期待:きたい}してたんだけどね。"]],
   o:["{話:はなし}がわかりにくくて、{期待:きたい}したほどではなかった","{俳優:はいゆう}が{下手:へた}でがっかりした","{音楽:おんがく}がよくなかった","とてもおもしろかったので、もう{一度:いちど}{見:み}たい"],
   zh:"男：昨天看的電影怎麼樣？就是現在很熱門的那部吧？女：嗯。演員都演得很好，音樂也不錯。但是劇情從中間開始就完全看不懂，看完之後也不知道到底是怎麼回事……男：這樣啊。女：我本來很期待的說。", note:"演員、音樂都好，但「話がわからなくなった」「期待してたんだけどね」→ 不如預期。"},
  {id:"3l3-3", type:"gaiyo", intro:"{学校:がっこう}で{先生:せんせい}が{話:はな}しています。", q:"{先生:せんせい}は{何:なに}について{話:はな}していますか。", lines:[

  if (m === "mock") return tx("迷你模考", "ミニ模試");
  if (m.startsWith("type:")){ const T = TYPES[m.slice(5)]; return `${SECS[T.sec].name}・${T.name}`; }
  if (m.startsWith("sec:")) return `${SECS[m.slice(4)].name}・${tx("混合", "ミックス")}`;
  if (m === "wrong") return tx("錯題本", "間違えた問題");
  if (m === "retry") return tx("重練錯題", "間違いを復習");
  return tx("練習", "練習");
}
function startClock(){ stopClock(); tick = setInterval(() => { const el = document.getElementById("clock"); if (el) el.textContent = mmss(Date.now() - quiz.start); }, 1000); }
function stopClock(){ if (tick){ clearInterval(tick); tick = null; } }
function mmss(ms){ const s = Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function cur(){ return quiz.items[quiz.i]; }
function select(disp){
  const q = cur(); const it = q.it;
  if (quiz.answers[it.id]) return;
  const k = q.order[disp];
  const ok = k === 0;
  quiz.answers[it.id] = {pick: disp, ok};
  const s = store.stats[it.id] || {r:0, w:0};
  if (ok) s.r++; else s.w++;
  s.last = ok ? 1 : 0;
  store.stats[it.id] = s;
  store.answered++; if (ok) store.correct++;
  const w = store.wrong.indexOf(it.id);
  if (!ok && w < 0) store.wrong.push(it.id);
  if (ok && w >= 0) store.wrong.splice(w, 1);
  save();
  if (!quiz.exam && AUDIO_TYPES.has(it.type)) stopSpeech();
  renderQuiz(false, true);
}
function next(){
  stopSpeech();
  if (quiz.i < quiz.items.length - 1){ quiz.i++; renderQuiz(true); window.scrollTo(0,0); }
  else { stopClock(); renderResult(true); }
}
function goHome(){ stopClock(); stopSpeech(); quiz = null; renderHome(); window.scrollTo(0,0); }

/* ---------------- Full-sentence answers for explanations ---------------- */
function fullHTML(it){
  const c = it.o[0];
  const fill = x => `<span class="fill">${jpHTML(x)}</span>`;
  switch (it.type){
    case "kanji": return jpHTML(it.p.replace(/\[([^\]]+)\]/, (m,w) => `{${w}:${c}}`));
    case "hyoki": return jpHTML(it.p.replace(/\[([^\]]+)\]/, (m,w) => `{${c}:${w}}`));
    case "bunmyaku": case "bunpo": return jpHTML(it.p).replace('<span class="blank">（　　）</span>', fill(c));
    case "narabe": { let k = 0; return jpHTML(it.p.replace(/＿★＿|＿＿＿/g, () => `\u0001${k++}\u0001`)).replace(/\u0001(\d)\u0001/g, (m,n) => fill(it.o[+n])); }
    case "iikae": return `${jpHTML(it.p)}<br>＝ ${fill(c)}`;
    case "yoho": return fill(c);
    case "bunsho": return `<span class="pb">${it.qi}</span> ${fill(c)}`;
    default: return "";
  }
}
function explainHTML(q, a){
  const it = q.it, ok = a.ok, right = q.order.indexOf(0);
  let h = `<div class="explain"><div class="verdict ${ok ? "ok" : "ng"}">${ok ? tx("答對了", "正解") : tx("答錯了", "不正解")} <span class="ans">${tx("正確答案", "正解は")} ${NUMS[right]}</span></div>`;
  const full = fullHTML(it);
  if (full) h += `<p class="full" lang="ja">${full}</p>`;
  if (AUDIO_TYPES.has(it.type)) h += transcriptHTML(q);
  if (it.zh) h += `<p class="zh"${ZH}>${esc(it.zh)}</p>`;
  if (it.note) h += `<p class="tip"${ZH}>${noteHTML(it.note)}</p>`;
  return h + `</div>`;
}
/* Notes are Chinese with Japanese inside 「」; mark the quoted bits as ja */
function noteHTML(s){ return esc(s).replace(RUBY_RE, (m,b,r) => `<ruby>${b}<rt>${r}</rt></ruby>`).replace(/「([^」]+)」/g, '<span lang="ja">「$1」</span>'); }
function transcriptHTML(q){
  const it = q.it;
  const sp = r => ({m:tx("男", "男"), f:tx("女", "女"), n:tx("旁白", "ナレーター")}[r] || "");
  let t = "";
  if (it.type === "kadai" || it.type === "point"){
    t += `<p><span class="sp">${sp("n")}</span>${jp(it.intro)}${jp(it.q)}</p>`;
    it.lines.forEach(([r,x]) => t += `<p><span class="sp">${sp(r)}</span>${jp(x)}</p>`);
  } else if (it.type === "gaiyo"){
    t += `<p><span class="sp">${sp("n")}</span>${jp(it.intro)}</p>`;
    it.lines.forEach(([r,x]) => t += `<p><span class="sp">${sp(r)}</span>${jp(x)}</p>`);
    t += `<p><span class="sp">${sp("n")}</span>${jp(it.q)}</p>`;
    q.order.forEach((k,i) => t += `<p><span class="sp">${NUMS[i]}</span>${jp(it.o[k])}</p>`);
  } else if (it.type === "hatsuwa"){
    t += `<p><span class="sp">${sp("n")}</span>${jp(it.ja)}</p>`;
    q.order.forEach((k,i) => t += `<p><span class="sp">${NUMS[i]}</span>${jp(it.o[k])}</p>`);
  } else {
    t += `<p><span class="sp">${sp(it.line[0])}</span>${jp(it.line[1])}</p>`;
    q.order.forEach((k,i) => t += `<p><span class="sp">${NUMS[i]}</span>${jp(it.o[k])}</p>`);
  }
  return `<div class="transcript">${t}</div>`;
}

/* ---------------- Render: quiz ---------------- */
const PLABEL = {"留言":"メモ","公告":"お知らせ","電子郵件":"メール","短文":"短文","課程表":"クラス案内"};
function passageHTML(it){
  const p = it.passage;
  /* Paragraph strings: a leading "!" means no first-line indent (memos, notices). Objects {table:[[header...],[row...]]} become tables. */
  const para = x => {
    if (typeof x !== "string") return `<table>${x.table.map((r,i) => `<tr>${r.map(c => i === 0 ? `<th>${jpHTML(c)}</th>` : `<td>${jpHTML(c)}</td>`).join("")}</tr>`).join("")}</table>`;
    const ni = x.startsWith("!");
    return `<p${ni ? ' class="ni"' : ""}>${jpHTML(ni ? x.slice(1) : x, it.type === "bunsho" ? it.qi : null)}</p>`;
  };
  const body = p.body.map(para).join("");
  const label = it.type === "bunsho" ? tx(`文章（空格 ${it.qi}）`, `文章（空欄 ${it.qi}）`) : (p.title_zh ? tx(p.title_zh, PLABEL[p.title_zh] || p.title_zh) : tx("文章", "文章"));
  return `<details class="passage" open><summary>${esc(label)}</summary><div class="ptext fz" lang="ja">${p.title ? `<h4>${jpHTML(p.title)}</h4>` : ""}${body}</div>${p.zh && quiz.answers[it.id] ? `<p class="note"${ZH} style="padding:0 14px">${esc(p.zh)}</p>` : ""}</details>`;
}
function audioHTML(q, a){
  const it = q.it;
  let h = `<div class="audio">`;
  if (tts.ok) h += `<button class="play" id="playbtn" data-act="play">${ICON_PLAY}${tx(" 播放題目", " 音声を再生")}</button><button class="btn-ghost" data-act="slow" aria-pressed="${store.slow ? "true" : "false"}">${tx("慢速", "ゆっくり")}</button>`;
  if (!a && !q.reveal) h += `<button class="btn-ghost" data-act="reveal">${tx("顯示原文", "スクリプトを表示")}</button>`;
  h += `</div><p class="note" id="anote">${audioNote()}</p>`;
  if (it.type === "hatsuwa") h += `<p class="situ"><span${ZH}>${esc(it.sit)}</span><span class="ja" lang="ja">${jpHTML(it.ja)}</span></p>`;
  if (it.type === "kadai" || it.type === "point") h += `<p class="prompt small fz" lang="ja">${jpHTML(it.q)}</p>`;
  if (q.reveal && !a) h += transcriptHTML(q);
  return h;
}
function audioNote(){
  if (!tts.ok) return tx("這個瀏覽器不支援語音朗讀，請按「顯示原文」用看的練習。", "このブラウザは音声の読み上げに対応していません。「スクリプトを表示」で読んで練習してください。");
  if (!hasJa()) return tx("找不到日文語音（可能還在載入）。若一直沒聲音，請到系統設定加裝日文語音，或按「顯示原文」。", "日本語の音声が見つかりません（読み込み中かもしれません）。音が出ない場合は端末に日本語音声を追加するか、「スクリプトを表示」を使ってください。");
  return tx("用瀏覽器內建的日文語音朗讀，語調和真正考試會有差異；聽不清楚可以重播。", "ブラウザの日本語音声で読み上げます。本番とはイントネーションが違います。聞き取れなければもう一度再生できます。");
}
function refreshAudioNote(){ const n = document.getElementById("anote"); if (n) n.textContent = audioNote(); }
function optionsHTML(q, a){
  const it = q.it;
  const spoken = it.type === "hatsuwa" || it.type === "sokuji" || it.type === "gaiyo";
  const long = it.type === "iikae" || it.type === "yoho" || PASSAGE_TYPES.has(it.type) || it.type === "kadai" || it.type === "point" || it.type === "gaiyo";
  const short = !long && !spoken && q.order.every(k => plain(it.o[k]).length <= 8);
  return `<div class="opts${short ? " grid2" : ""}">` + q.order.map((k,i) => {
    const txt = (spoken && !a && !q.reveal) ? `<span class="hid">${tx(`（聽第 ${i+1} 個說法）`, `（${i+1} 番目を聞く）`)}</span>` : `<span lang="ja" class="fz">${jpHTML(it.o[k], null, it.type === "kanji" || it.type === "hyoki")}</span>`;
    let cls = "opt" + (long ? " long" : "");
    let mk = "";
    if (a){
      if (a.pick === i) cls += " picked";
      if (!quiz.exam){ if (k === 0){ cls += " right"; mk = tx("正解", "正解"); } else if (a.pick === i){ cls += " wrong"; mk = tx("你的答案", "あなたの答え"); } }
    }
    const tag = a ? "div" : "button";
    return `<${tag} class="${cls}"${a ? "" : ` data-act="pick" data-i="${i}"`}><span class="bub">${NUMS[i]}</span>${txt}<span class="mk">${mk}</span></${tag}>`;
  }).join("") + `</div>`;
}
function renderQuiz(anim, justPicked){
  const q = cur(), it = q.it, T = TYPES[it.type], a = quiz.answers[it.id];
  view = it.passage ? "quiz-p" : "quiz";
  $app.dataset.view = view; resetLook();
  $app.dataset.look = quiz.exam ? "off" : (a ? "" : "pre");
  const strip = quiz.items.map((x,i) => { const aa = quiz.answers[x.it.id]; let c = ""; if (i === quiz.i) c = "cur"; else if (aa) c = quiz.exam ? "done" : (aa.ok ? "ok" : "ng"); return `<i class="${c}">${i+1}</i>`; }).join("");
  let body = "";
  if (it.type === "yoho") body += `<p class="word" lang="ja">${jpHTML(it.p)}</p>`;
  else if (["narabe","bunpo","bunmyaku","kanji","hyoki","iikae"].includes(it.type)) body += `<p class="prompt fz" lang="ja">${jpHTML(it.p)}</p>`;
  else if (PASSAGE_TYPES.has(it.type) && it.type !== "bunsho") body += `<p class="prompt small fz" lang="ja">${jpHTML(it.q)}</p>`;
  if (AUDIO_TYPES.has(it.type)) body = audioHTML(q, a) + body;

  const head = `<div class="qnum"><span class="ptag" lang="ja">${T.no} ${T.name}</span><span>${esc(L2(T.inst))}</span><button class="btn-ghost furi-btn" data-act="furi" aria-pressed="${store.furi ? "true" : "false"}">${tx("假名", "ふりがな")}</button></div>`;

                  (quiz.exam ? `<div class="qnav"><button class="btn alt" data-act="skip">${last ? tx("交卷", "提出") : tx("先跳過", "とばす")}</button></div>` : "");
  $app.innerHTML = `${prefsHTML()}
    <div class="qtop">${back()}<div class="qtitle" lang="ja">${esc(quizTitle())}</div>
      <div class="qcount">${quiz.exam ? `<span class="tl" id="clock">${mmss(Date.now() - quiz.start)}</span>` : ""}${quiz.i+1}/${quiz.items.length}</div></div>
    <div class="strip" aria-hidden="true">${strip}</div>

    ${nav}
    ${quiz.exam ? "" : `<p class="lookhint">${a ? tx("點日文單字可以看中文和說明。", "単語をタップすると中国語の意味と説明が出ます。") : tx("點日文單字可以看中文和說明；選項和畫底線的字要作答後才能查。", "単語をタップすると中国語の意味と説明が出ます。選択肢と下線の語は解答後に調べられます。")}</p>`}
    <p class="kbd">${tx("鍵盤：", "キー：")}<kbd>1</kbd>–<kbd>4</kbd> ${tx("作答", "で解答")}　<kbd>Enter</kbd> ${tx("下一題", "で次へ")}${AUDIO_TYPES.has(it.type) ? `　<kbd>${tx("空白鍵", "スペース")}</kbd> ${tx("播放", "で再生")}` : ""}</p>`;
  if (justPicked && !reduceMotion){ const p = $app.querySelector(".opt.picked"); if (p) p.classList.add("anim"); }
  if (justPicked){ const nb = document.getElementById("nextbtn"); if (nb) nb.focus({preventScroll:true}); const ex = $app.querySelector(".explain"); if (ex && ex.getBoundingClientRect().top > innerHeight - 80) ex.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block:"nearest"}); }
  if (anim && AUDIO_TYPES.has(it.type) && hasJa() && !a) setTimeout(() => { if (quiz && cur() === q && !quiz.answers[it.id]) speakSeq(audioParts(it, q.order)); }, 350);
}

/* ---------------- Render: result ---------------- */
function snippet(it){
  if (it.type === "kadai" || it.type === "point" || it.type === "gaiyo") return [plain(it.q), "ja"];
  if (it.type === "hatsuwa") return [it.sit, "zh-Hant"];
  if (it.type === "sokuji") return [plain(it.line[1]), "ja"];
  if (it.passage) return [it.q ? plain(it.q) : `${plain(it.passage.title || "文章")}（${it.qi}）`, "ja"];
  return [plain(it.p), "ja"];
}
function renderResult(first){
  view = "result"; $app.dataset.view = view; resetLook();
  const list = quiz.items, n = list.length;
  const isOk = x => !!(quiz.answers[x.it.id] && quiz.answers[x.it.id].ok);
  const ok = list.filter(isOk).length;
  const pct = Math.round(ok / n * 100);
  const bySec = {}, byType = {};
  list.forEach(x => {
    const sec = TYPES[x.it.type].sec, t = x.it.type;
    const s = sec === "chokai" ? "聴解" : !isN3() ? "言語知識・読解" : sec === "dokkai" ? "読解" : "言語知識";
    bySec[s] = bySec[s] || [0,0]; bySec[s][1]++; byType[t] = byType[t] || [0,0]; byType[t][1]++;
    if (isOk(x)){ bySec[s][0]++; byType[t][0]++; }
  });
  const msg = pct >= 80 ? tx("很穩，考前保持手感就好", "安定しています。この調子で！") : pct >= 60 ? tx("及格邊緣以上，把錯題再看一次", "合格ライン以上。間違えた問題をもう一度") : tx("先別慌，錯題本會幫你收好", "大丈夫、間違えた問題はリストに残っています");
  if (first && quiz.mode === "mock"){ const prev = store[bestKey()]; if (!prev || pct > prev.pct){ store[bestKey()] = {pct, at: Date.now()}; save(); } }
  if (first) quiz.end = Date.now();
  const wrongN = n - ok;
  $app.innerHTML = `${prefsHTML()}
    <div class="qtop">${back()}<div class="qtitle" lang="ja">${esc(quizTitle())}・${tx("結果", "結果")}</div></div>
    <section class="sheet">
      <div class="score"><div class="big">${ok}<small>/${n}</small></div><div class="msg2"><b>${msg}</b><span>${tx("正確率", "正答率")} ${pct}%${quiz.exam ? `・${tx("用時", "所要時間")} ${mmss((quiz.end || Date.now()) - quiz.start)}` : ""}</span></div></div>
      ${Object.keys(bySec).length > 1 ? `<div class="parts">${Object.entries(bySec).map(([k,v]) => `<span><em lang="ja">${k}</em> ${v[0]}/${v[1]}</span>`).join("")}</div>` : ""}
      <div class="parts">${Object.entries(byType).map(([t,v]) => `<span><em lang="ja">${TYPES[t].name}</em> ${v[0]}/${v[1]}</span>`).join("")}</div>
      ${quiz.mode === "mock" ? `<p class="note" style="padding:12px 16px 0;margin:0">${isN3() ? tx("正式考試合格要總分 95/180，而且「言語知識（文字・語彙・文法）」「讀解」「聽解」三科都至少 19/60。這裡的題目是自編的，正確率只能當參考，不能換算成正式分數。", "本番の合格には総合得点 95/180 以上、かつ「言語知識（文字・語彙・文法）」「読解」「聴解」がそれぞれ 19/60 以上必要です。ここの問題はオリジナルなので、正答率は目安です。本番の得点には換算できません。") : tx("正式考試合格要總分 90/180，而且「言語知識・讀解」至少 38/120、「聽解」至少 19/60。這裡的題目是自編的，正確率只能當參考，不能換算成正式分數。", "本番の合格には総合得点 90/180 以上、かつ「言語知識・読解」38/120 以上、「聴解」19/60 以上が必要です。ここの問題はオリジナルなので、正答率は目安です。本番の得点には換算できません。")}</p>` : ""}
      <div class="qnav" style="padding:14px 16px">
        ${wrongN ? `<button class="btn alt" data-act="retry">${tx(`重練這次的錯題（${wrongN}）`, `今回の間違いを復習（${wrongN}）`)}</button>` : ""}
        <button class="btn" data-act="again">${quiz.mode === "mock" ? tx("再考一次", "もう一度受ける") : tx("再練 10 題", "もう 10 問")}</button>
      </div>
    </section>
    <section class="sheet"><div class="sec-head">${tx("逐題檢討", "解答の確認")}<small>${tx("點一題看解析", "タップで解説")}</small></div><div class="rlist">
      ${list.map((x,i) => { const a = quiz.answers[x.it.id]; const g = a && a.ok ? "ok" : "ng"; const [sn, sl] = snippet(x.it);
        return `<details><summary><span class="g ${g}">${a && a.ok ? "○" : "×"}</span><span class="s"><em lang="ja">${esc(TYPES[x.it.type].name)}</em><span lang="${sl}">${esc(sn)}</span></span><span class="r">${i+1}</span></summary>
        <div class="rx">${a ? "" : `<p class="zh">${tx("沒有作答", "未解答")}</p>`}${explainHTML(x, a || {ok:false, pick:-1}).replace('<div class="explain">','<div>')}</div></details>`; }).join("")}
    </div></section>`;
  if (first) window.scrollTo(0,0);
}

function daysLeft(){ const ms = EXAM.start - Date.now(); return Math.ceil(ms / 86400000); }
function examLabel(){ return tx("2026/12/6（日）", "2026年12月6日（日）"); }
function countHTML(){
  const d = daysLeft();
  if (d > 0) return `<div class="count"><small>${tx("距離考試", "試験まで")}</small><b>${d}</b><span>${tx("日", "日")}</span></div>`;
  if (d > -1) return `<div class="count today"><small>${tx("今天考試", "今日は試験日")}</small><b lang="ja">がんばって！</b></div>`;

}
function typeStats(types){
  let seen = 0, total = 0, r = 0, all = 0;
  types.forEach(t => BY_TYPE[t].forEach(it => { total++; const s = statOf(it.id); if (s){ seen++; r += s.r; all += s.r + s.w; } }));
  return {seen, total, acc: all ? Math.round(r / all * 100) : null};
}

function cardAnswer(knew){
  const v = deck.cards[deck.i]; if (!v) return;
  if (deck.mine){ if (knew){ delete store.mywords[v.key]; deck.knew++; } }

  save(); deck.i++; deck.flipped = false; renderCards();
}

      <div class="row"><span>${tx("例句", "例文")}</span><span class="ex"><span lang="ja">${jpHTML(g.ex)}</span>${tts.ok ? `<button class="say-sm" data-act="sayg" data-t="${esc(g.ex)}" aria-label="${tx("念例句", "例文を読み上げ")}">${ICON_SPEAK}</button>` : ""}<small${ZH}>${esc(g.exzh)}</small></span></div>
      ${g.tip ? `<div class="warn"${ZH}>${noteHTML(g.tip)}</div>` : ""}</div></details>`).join("");
  if (keepFocus){
    const box = $app.querySelector(".glist"), cnt = $app.querySelector(".qcount");
    if (box){ box.innerHTML = items || empty; cnt.textContent = `${list.length}/${GRAMMAR.length}`; return; }
  }
  $app.innerHTML = `${prefsHTML()}
    <div class="qtop">${back()}<div class="qtitle">${tx("文法速查", "文法一覧")}</div><div class="qcount">${list.length}/${GRAMMAR.length}</div></div>
    <input class="search" type="search" id="gsearch" placeholder="${tx("搜尋文法、中文意思或例句", "文法・意味・例文で検索")}" value="${esc(gram.q)}" autocomplete="off">
    <div class="chips">${gcats().map(c => `<button class="chip" data-act="gcat" data-c="${c}" aria-pressed="${gram.cat === c}">${gcat(c)}</button>`).join("")}</div>
    <section class="sheet glist">${items || empty}</section>`;
}

${isN3() ? `

          <tr><th lang="ja">聴解</th><td>${tx("至少 19 分（滿分 60）", "19 点以上（60 点満点）")}</td></tr>` : `          <tr><th>${tx("總分", "総合得点")}</th><td>${tx("90 分以上（滿分 180）", "90 点以上（180 点満点）")}</td></tr>
          <tr><th lang="ja">言語知識・読解</th><td>${tx("至少 38 分（滿分 120）", "38 点以上（120 点満点）")}<small>${tx("文字・語彙・文法和讀解合在一起算", "文字・語彙・文法と読解の合計")}</small></td></tr>
          <tr><th lang="ja">聴解</th><td>${tx("至少 19 分（滿分 60）", "19 点以上（60 点満点）")}</td></tr>`}
        </table>
        <div class="pad" style="border-top:1px solid var(--line)"><p>${tx("總分夠了但有一科低於基準分，仍然不合格；缺考任何一科也不合格。", "総合得点が足りていても、基準点に届かない区分が一つでもあれば不合格です。欠席した科目がある場合も不合格になります。")}</p></div>
        <p class="src">${tx("來源：", "出典：")}<a href="https://www.jlpt.jp/e/guideline/results.html" target="_blank" rel="noopener">jlpt.jp 認定結果</a></p>
      </section>
    </div>
    <div class="info-col">
      <section class="sheet"><div class="sec-head">${tx(`${LV.label} 題型`, `${LV.label} の問題形式`)}</div>
        <div class="pad" style="padding-bottom:0"><b lang="ja">言語知識（文字・語彙）</b></div><ol class="types">${SEC_TYPES.goi.map(T).join("")}</ol>
        <div class="pad" style="padding:0 16px"><b lang="ja">言語知識（文法）・読解</b></div><ol class="types">${[...SEC_TYPES.bunpo, ...SEC_TYPES.dokkai].map(T).join("")}</ol>
        <div class="pad" style="padding:0 16px"><b lang="ja">聴解</b></div><ol class="types">${SEC_TYPES.chokai.map(T).join("")}</ol>

          <p>${tx("准考證：2026 年第 2 回已於 11/16（一）用平信郵簡寄出。", "受験票：2026年第2回分は 11/16（月）に普通郵便で発送済みです。")}</p>
          <p>${tx("聯絡 LTTC：(02) 2365-5050（週一至週五上班時間）、jlpt@lttc.ntu.edu.tw。", "問い合わせ：LTTC (02) 2365-5050（平日の業務時間）、jlpt@lttc.ntu.edu.tw")}</p>
        </div>
        <p class="src">${tx("來源：", "出典：")}<a href="https://www.jlpt.tw/" target="_blank" rel="noopener">jlpt.tw</a>、<a href="https://www.jpf.go.jp/j/information/2026/notice_20261119.html" target="_blank" rel="noopener">${tx("國際交流基金會公告（2026/11/19）", "国際交流基金のお知らせ（2026/11/19）")}</a></p>

/* ---------------- Events ---------------- */
function startType(t){ startQuiz("type:" + t, itemsForType(t)); }
function startSecMix(s){
  const pool = SEC_TYPES[s].filter(t => !PASSAGE_TYPES.has(t)).flatMap(t => BY_TYPE[t]);
  let items = pickItems(pool, 10);
  if (s === "dokkai") items = isN3() ? [...pickPassages("tan", 2), ...pickPassages("chu", 3), ...pickPassages("cho", 4), ...pickPassages("joho", 2)]
                                     : [...pickPassages("tan", 3), ...pickPassages("chu", 3), ...pickPassages("joho", 2)];
  if (s === "bunpo") items = [...pickItems(BY_TYPE.bunpo, 5), ...pickItems(BY_TYPE.narabe, 2), ...pickPassages("bunsho", 4)];
  startQuiz("sec:" + s, items);
}
function again(){
  const m = quiz.mode;
  if (m === "mock") return startQuiz("mock", buildMock(), true);
  if (m.startsWith("type:")) return startType(m.slice(5));
  if (m.startsWith("sec:")) return startSecMix(m.slice(4));
  if (m === "wrong" || m === "retry") return startWrong();
  goHome();
}
function startWrong(){ const ids = shuffle(store.wrong.filter(id => ITEMS[id])).slice(0, 15); if (!ids.length) return goHome(); startQuiz("wrong", ids.map(id => ITEMS[id])); }
/* Redraw the current screen after a language switch; answers, timers and card position are kept */
function rerender(){
  if ((view === "quiz" || view === "quiz-p") && quiz) renderQuiz(false);
  else if (view === "result" && quiz) renderResult(false);
  else if (view === "cards" && deck) renderCards();
  else if (view === "grammar") renderGrammar();
  else if (view === "info") renderInfo();
  else if (view === "sec") renderSec(curSec);
  else renderHome();
}
$app.addEventListener("click", e => {
  const wEl = e.target.closest(".w");
  if (wEl){
    const block = lookBlock(wEl);
    if (block !== "pick"){ e.preventDefault(); e.stopPropagation(); if (wcur && wcur.el === wEl) closeWord(); else openWord(wEl, block); return; }
  }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  switch (act){
    case "home": return goHome();
    case "lang":
      if (lang !== el.dataset.v){ lang = store.lang = el.dataset.v; save(); applyLang(); rerender(); }
      return;
    case "level":
      if (LV.key !== el.dataset.v){
        store.level = el.dataset.v; save(); useLevel(store.level); applyLang();
        stopClock(); stopSpeech(); quiz = null; deck = null; gram = {q:"", cat:"全部"}; curSec = "goi";
        renderHome(); window.scrollTo(0,0);
      }
      return;
    case "theme":
      store.theme = el.dataset.v; save(); applyTheme();
      document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === currentTheme()));
      return;
    case "mock": return startQuiz("mock", buildMock(), true);
    case "sec": renderSec(el.dataset.s); return window.scrollTo(0,0);
    case "type": return startType(el.dataset.t);
    case "secmix": return startSecMix(el.dataset.s);
    case "pick": return select(+el.dataset.i);
    case "skip": quiz.answers[cur().it.id] = undefined; return next();
    case "next": return next();
    case "play": { const q = cur(); return speakSeq(audioParts(q.it, q.order)); }
    case "reveal": cur().reveal = true; return renderQuiz(false);
    case "slow": store.slow = !store.slow; save(); el.setAttribute("aria-pressed", store.slow ? "true" : "false"); { const q = cur(); return speakSeq(audioParts(q.it, q.order)); }
    case "furi": store.furi = !store.furi; save(); applyFuri(); el.setAttribute("aria-pressed", store.furi ? "true" : "false"); return;
    case "retry": { const ids = quiz.items.filter(x => !(quiz.answers[x.it.id] && quiz.answers[x.it.id].ok)).map(x => x.it); return startQuiz("retry", ids); }
    case "again": return again();
    case "wrong": return startWrong();
    case "cards": return startCards("全部");
    case "mywords": return startMyWords();
    case "vcat": return startCards(el.dataset.c);
    case "flip": if (e.target.closest(".say")) return; deck.flipped = !deck.flipped; return renderCards();
    case "sayv": e.stopPropagation(); { const v = deck.cards[deck.i]; if (v) sayText(v.r); } return;
    case "known": return cardAnswer(true);
    case "unknown": return cardAnswer(false);
    case "grammar": gram = {q:"", cat:"全部"}; renderGrammar(); return window.scrollTo(0,0);
    case "gcat": gram.cat = el.dataset.c; return renderGrammar();
    case "sayg": e.preventDefault(); return sayText(el.dataset.t);
    case "info": return renderInfo();
    case "reset":
      if (confirm(tx("確定清除所有練習紀錄、錯題本和單字卡進度？", "すべての記録、間違えた問題、単語カードの進み具合を消しますか？"))){
        const keep = {furi: store.furi, checks: store.checks, lang: store.lang, theme: store.theme, mywords: store.mywords, slow: store.slow, level: store.level};
        Object.keys(store).forEach(k => delete store[k]);
        Object.assign(store, {stats:{}, wrong:[], answered:0, correct:0, known:{}, best:null}, keep); save(); renderHome();
      }
      return;
  }
});
$app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "check"){ store.checks[el.dataset.k] = el.checked; save(); }
  if (el.dataset.act === "furi-sw"){ store.furi = el.checked; save(); applyFuri(); }
});
$app.addEventListener("input", e => { if (e.target.id === "gsearch"){ gram.q = e.target.value; renderGrammar(true); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && wcur){ closeWord(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if ((view === "quiz" || view === "quiz-p") && quiz){
    const q = cur(), a = quiz.answers[q.it.id];
    const n = q.it.o.length;
    if (!a && /^[1-4]$/.test(e.key) && +e.key <= n){ e.preventDefault(); return select(+e.key - 1); }
    if (a && e.key === "Enter" && e.target.tagName !== "BUTTON"){ e.preventDefault(); return next(); }
    if (e.key === " " && AUDIO_TYPES.has(q.it.type) && tts.ok && e.target.tagName !== "BUTTON"){ e.preventDefault(); return speakSeq(audioParts(q.it, q.order)); }
  }
  if (view === "cards" && deck && deck.i < deck.cards.length){
    if (e.key === " " && e.target.tagName !== "BUTTON"){ e.preventDefault(); deck.flipped = !deck.flipped; return renderCards(); }
    if (e.key === "ArrowRight"){ e.preventDefault(); return cardAnswer(true); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); return cardAnswer(false); }
  }
  if (view === "cards" && e.key === "Enter" && e.target.classList && e.target.classList.contains("fcard")){ deck.flipped = !deck.flipped; renderCards(); }
});

renderHome();
</script>
